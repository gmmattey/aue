<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Política de privacidade — Auê</title>

    <meta name="theme-color" content="#0a0a08" />

    <!--
      A FONTE VEM DAQUI, E NÃO DE DENTRO DO CSS.

      Isto era um `@import` na primeira linha de `src/index.css`. Nesse formato o
      navegador só descobre a fonte DEPOIS de baixar o CSS: a requisição entra
      numa fila que ela mesma não podia ter começado, e o primeiro texto da Arena
      espera duas viagens em vez de uma. Aqui no `<head>` ele vê a fonte no
      primeiro byte do documento, e o `preconnect` já abre a conexão enquanto o
      resto baixa.

      `display=swap` é o que impede texto invisível esperando fonte: aparece na
      hora, no fallback, e troca quando a Archivo chega.

      Pesos 400, 600 e 700 porque são os únicos que o CSS do Auê usa. Quem
      precisar de 500 amanhã acrescenta nesta URL JUNTO com o CSS que usa — não
      antes.

      As quatro entradas HTML carregam isto igual, byte por byte.
      `src/fonte-nas-entradas.test.ts` derruba a suíte quando uma fica para trás.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      POR QUE ESTA PÁGINA TEM HTML PRÓPRIO
      ------------------------------------
      O app é uma SPA. Antes, `vercel.json` reescrevia QUALQUER caminho para o
      `index.html` — logo, `/privacidade` era servida com o `<title>` da home, a
      descrição da home e, o pior, `<link rel="canonical">` apontando para a
      home. Ao mesmo tempo `public/sitemap.xml` declarava `/privacidade` como URL
      indexável. Os dois se contradiziam, e nessa briga o canonical ganha: o
      Google trata a URL como duplicata da raiz e a política tende a nunca ser
      indexada.

      A saída foi transformar as rotas indexáveis em ENTRADAS DE VERDADE da
      build (`vite.config.ts` → `rollupOptions.input`). Cada uma vira um `.html`
      próprio no `dist/`, servido pela hospedagem quando a URL é aberta direto —
      e cada uma declara o seu próprio canonical, título e descrição. O conteúdo
      continua vindo do mesmo componente React (`src/features/legal/`), então não
      há texto legal duplicado em dois lugares para divergir.

      O LIMITE, DITO SEM MAQUIAGEM: isto NÃO é prerender. O texto da política só
      existe depois que o JavaScript roda. O Googlebot renderiza JS e enxerga; um
      rastreador que não renderiza vê apenas o `<noscript>` abaixo. O que esta
      mudança entrega é a identidade correta da URL — canonical, título e
      descrição verdadeiros —, não conteúdo estático. Entregar o texto sem JS
      exigiria prerender no build, que não está no corte do MVP1.

      SEM Open Graph e SEM JSON-LD aqui, de propósito: ninguém compartilha a
      política de privacidade num grupo de WhatsApp, e cada bloco desses seria
      mais um lugar onde o domínio pode envelhecer sem ninguém notar.
    -->
    <meta
      name="description"
      content="O que o Auê faz com o seu áudio e com a sua identidade anônima: quem consegue ouvir, por quanto tempo fica guardado e como pedir a exclusão."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://aue.web.app/privacidade" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Auê" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Política de privacidade do Auê</h1>
      <p>
        O Auê é um juiz de arroto que roda no navegador. Ele não pede cadastro,
        não usa ferramenta de rastreamento e só acessa o microfone no momento em
        que você toca em gravar. O áudio enviado fica guardado e pode ser ouvido
        por quem abrir a batalha em que você gravou.
      </p>
      <p>
        Você pode apagar a sua gravação dentro do jogo, no botão "Apagar o meu
        arroto", enquanto tiver o link daquela disputa aberto no mesmo
        navegador. Não existe exclusão automática: o que expira em 7 dias é o
        acesso pelo link, não a gravação.
      </p>
      <p>
        O texto completo desta política é exibido pelo aplicativo e precisa de
        JavaScript ativado. Se você perdeu o link ou limpou o navegador, os
        pedidos de exclusão passam pelo contato informado na página.
      </p>
      <p><a href="/termos">Termos de uso</a> · <a href="/">Voltar ao Auê</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
