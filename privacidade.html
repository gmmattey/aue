<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Política de privacidade — Auê</title>

    <meta name="theme-color" content="#0a0a08" />

    <!--
      Esta rota tem HTML próprio para declarar título, descrição e canonical
      verdadeiros antes do React montar. O conteúdo completo continua vindo do
      mesmo componente da aplicação.
    -->
    <meta
      name="description"
      content="O que o Auê faz com o seu áudio e com a sua identidade anônima: quem consegue ouvir, por quanto tempo fica guardado e como pedir a exclusão."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://aue.web.app/privacidade" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Auê" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Política de privacidade do Auê</h1>
      <p>
        O Auê é um juiz de arroto que roda no navegador. Ele não pede cadastro,
        não usa ferramenta de rastreamento e só acessa o microfone no momento em
        que você toca em gravar. O áudio enviado fica guardado e pode ser ouvido
        por quem abrir a batalha em que você gravou.
      </p>
      <p>
        Você pode apagar a sua gravação dentro do jogo, no botão "Apagar o meu
        arroto", enquanto tiver o link daquela disputa aberto no mesmo
        navegador. Não existe exclusão automática: o que expira em 7 dias é o
        acesso pelo link, não a gravação.
      </p>
      <p>
        O texto completo desta política é exibido pelo aplicativo e precisa de
        JavaScript ativado. Se você perdeu o link ou limpou o navegador, os
        pedidos de exclusão passam pelo contato informado na página.
      </p>
      <p><a href="/termos">Termos de uso</a> · <a href="/">Voltar ao Auê</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
