<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `viewport-fit=cover` NAO e enfeite: sem ele o Safari do iPhone devolve
      ZERO em todo `env(safe-area-inset-*)`. A barra de navegacao do app ja
      pedia `env(safe-area-inset-bottom)` e vinha recebendo zero desde sempre —
      ela parecia respeitar a faixa do gesto e nao respeitava (#69).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Auê — grave seu arroto, receba a nota e desafie os amigos</title>

    <meta name="theme-color" content="#0a0a08" />

    <!--
      iOS: "Adicionar à Tela de Início".

      A landing de desktop (src/features/desktop/TelaDesktop.tsx) ENSINA esse
      gesto para quem está no Safari, porque no iPhone não existe
      `beforeinstallprompt` e é o único caminho de instalação. Sem as tags
      abaixo, seguir a instrução produzia um ícone genérico — uma miniatura da
      captura da página, com a barra de endereço dentro — e um app que abre
      dentro do Safari, com barra de navegação e tudo.

      O manifest NÃO resolve isto sozinho: o Safari só passou a ler `icons` do
      manifest recentemente e continua preferindo `apple-touch-icon`. Nenhuma
      destas tags tem efeito fora do iOS/iPadOS.

      `apple-touch-icon.png` é 180x180 sem canal alfa, gerado a partir de
      public/pwa-512x512.png — o iOS não compõe transparência, ele pinta o que
      sobra de preto.

      `black` e não `black-translucent` no status bar: o translúcido joga o
      conteúdo para debaixo do relógio e da bateria, e a barra do app já é
      escura. O ganho seria zero e o custo seria um cabeçalho cortado.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Auê" />

    <!--
      SEO.

      DOMÍNIO CONFIRMADO em 2026-08-08 por Luiz: https://aue.vercel.app.
      Antes disto, `canonical`, `og:url` e `og:image` estavam ausentes DE
      PROPÓSITO — o domínio era suposição (aue.app), e um canonical apontando
      para um domínio que não é o publicado é o pior caso possível de SEO:
      instrui o buscador a não indexar a URL real.

      Se o domínio mudar (um aue.app de verdade, por exemplo), estes lugares
      mudam JUNTOS, senão o canonical passa a mentir:
        1. este arquivo (canonical, og:url, og:image, twitter:image, JSON-LD)
        2. privacidade.html e termos.html (o canonical de cada uma)
        3. public/robots.txt
        4. public/sitemap.xml
        5. src/shared/desktop/enderecoPublico.ts (QR Code e "copiar link")
        6. supabase/functions/og-preview/index.ts

      De 1 a 5 estão travados por src/seo-publico.test.ts: mudar um e esquecer
      os outros quebra o teste. O item 6 é Edge Function e continua na mão.

      ESTE canonical vale para a HOME, e só para ela. Cada rota indexável tem o
      seu próprio HTML de entrada com o seu próprio canonical — antes existia um
      arquivo só, o rewrite da Vercel servia ele em qualquer caminho, e
      /privacidade era entregue declarando a home como canônica enquanto o
      sitemap jurava que /privacidade era indexável. Os dois não podem
      discordar: o canonical ganha, e a página some do índice.

      A descrição NÃO fala mais em "ranking global, XP e níveis": as três
      coisas existem em código mas estão DESLIGADAS no corte de lançamento
      (src/shared/flags.ts). Prometer no buscador o que a tela não entrega é a
      pior primeira impressão possível.
    -->
    <meta name="description" content="Grave um arroto, receba a nota do Auê e desafie um amigo por link. Sem cadastro, direto no navegador. Quem arrota mais alto do grupo?" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://aue.vercel.app/" />

    <!--
      Open Graph ESTÁTICO: este é o card de quem compartilha a home ou um link
      de batalha. O card DINÂMICO por batalha (com a nota de quem desafiou)
      depende da Edge Function `og-preview` e do rewrite de crawler, que
      continuam fora do lançamento. Ver
      docs/technical/deploy-vercel-e-og-dinamico.md.

      `og:image` voltou porque public/og-image.png agora EXISTE (1200x630,
      gerado a partir do símbolo oficial da marca). Enquanto ele não existia, a
      tag apontava para 404 — o que não produz imagem nenhuma e ainda faz
      validadores reportarem erro. Se o arquivo for removido, remova a tag
      junto.

      Isto não é decoração: é a imagem que WhatsApp, Telegram e X mostram
      quando alguém manda o link da batalha. Sem ela, o convite chega como um
      link pelado num grupo de família.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Auê" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://aue.vercel.app/" />
    <meta property="og:title" content="Auê — grave seu arroto e desafie os amigos" />
    <meta property="og:description" content="Grave, receba a sua nota e mande a batalha por link. Sem cadastro." />
    <meta property="og:image" content="https://aue.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Símbolo do Auê: uma bolha verde-limão com um ponto de exclamação vazado." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Auê — grave seu arroto e desafie os amigos" />
    <meta name="twitter:description" content="Grave, receba a sua nota e mande a batalha por link. Sem cadastro." />
    <meta name="twitter:image" content="https://aue.vercel.app/og-image.png" />

    <!--
      Dados estruturados. O app é uma SPA: até o JavaScript rodar, o buscador
      só tem o <title>, a description e o <noscript> abaixo. Este bloco dá a
      ele um fato a mais que não depende de renderização — o que é o produto,
      em que idioma, e que é de graça.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Auê",
        "url": "https://aue.vercel.app/",
        "description": "Grave um arroto, receba uma nota de 0 a 100 e desafie os amigos por link.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "inLanguage": "pt-BR",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" }
      }
    </script>

    <!--
      Google AdSense: o script NÃO é carregado aqui.

      Antes, esta tag disparava uma requisição ao Google em toda visita com
      `client=ca-pub-XXXXXXXXXXXXXXXX` — um id que nunca foi válido. Custo de
      privacidade em toda sessão, receita zero.

      Agora o carregamento é feito sob demanda pelo componente `AdBanner`, e
      só quando `VITE_ADSENSE_CLIENT` está configurado. Ver src/shared/components/AdBanner.tsx.
    -->
  </head>
  <body>
    <div id="root"></div>
    <!--
      O que existe sem JavaScript.

      Não é acessibilidade teórica: é o único conteúdo que um rastreador sem
      execução de JS enxerga desta página. A landing de desktop
      (src/features/desktop/TelaDesktop.tsx) é o conteúdo indexável de
      verdade, mas ela depende do React ter montado.
    -->
    <noscript>
      <h1>Auê — grave seu arroto e receba a nota</h1>
      <p>
        O Auê é um juiz de arroto que roda no navegador: você grava, ele analisa
        duração, potência, profundidade e textura do som, e devolve uma nota de
        0 a 100. Depois é só mandar o link para um amigo, ouvir o arroto dele e
        descobrir quem arrota mais alto do grupo. Sem cadastro.
      </p>
      <p>Para usar o Auê é preciso ativar o JavaScript no navegador.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
