    <noscript>
      <h1>Auê! — competição de arroto online</h1>
      <p>
        O Auê transforma arroto em competição. Você arrota, recebe uma nota de
        0 a 100 e usa esse número como placar para desafiar outra pessoa. A
        maior nota leva o round.
      </p>
      <p>
        Depois da nota, mande o link do X1 para um amigo. Ele ouve o seu arroto,
        grava a resposta no próprio celular e coloca a nota dele contra a sua.
        Não precisa criar conta, procurar sala nem combinar horário.
      </p>
      <p>
        Perdeu? Tem revanche. Ganhou? Também. O Auê roda direto no navegador,
        de graça e sem cadastro na frente.
      </p>
