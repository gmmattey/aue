<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Como jogar o Auê! — jogo de arroto online</title>

    <meta name="theme-color" content="#0a0a08" />

    <!--
      A FONTE VEM DAQUI, E NÃO DE DENTRO DO CSS.

      Isto era um `@import` na primeira linha de `src/index.css`. Nesse formato o
      navegador só descobre a fonte DEPOIS de baixar o CSS: a requisição entra
      numa fila que ela mesma não podia ter começado, e o primeiro texto da Arena
      espera duas viagens em vez de uma. Aqui no `<head>` ele vê a fonte no
      primeiro byte do documento, e o `preconnect` já abre a conexão enquanto o
      resto baixa.

      `display=swap` é o que impede texto invisível esperando fonte: aparece na
      hora, no fallback, e troca quando a Archivo chega.

      Pesos 400, 600 e 700 porque são os únicos que o CSS do Auê usa. Quem
      precisar de 500 amanhã acrescenta nesta URL JUNTO com o CSS que usa — não
      antes.

      As quatro entradas HTML carregam isto igual, byte por byte.
      `src/fonte-nas-entradas.test.ts` derruba a suíte quando uma fica para trás.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      POR QUE ESTA PÁGINA EXISTE, E POR QUE ELA TEM HTML PRÓPRIO

      A home é a Arena: uma superfície de estado, que só existe depois que o
      JavaScript roda e que não tem texto explicando o produto — nem deve ter,
      porque explicar no meio do jogo é atrito.

      Esta página é o único lugar público onde o Auê se explica por escrito: o
      que é, como se joga, que roda no navegador e que é de graça. Serve para
      quem chegou pelo buscador sem saber o que vai encontrar, e serve para o
      próprio buscador entender a categoria do produto.

      O HTML de entrada é o mesmo mecanismo de `privacidade.html` e
      `termos.html`, e pelo mesmo motivo: `vercel.json` reescreve qualquer
      caminho para o `index.html`, então sem esta entrada a URL seria servida
      com o `<title>`, a descrição e o `canonical` da HOME — e o sitemap, que
      declara `/como-jogar` como indexável, estaria brigando com o canonical.
      Nessa briga o canonical ganha e a página some do índice.

      LIMITE DECLARADO, igual às outras: isto NÃO é prerender. O conteúdo
      completo é montado pelo React (`src/features/publico/ComoJogar.tsx`) e
      só aparece com JavaScript. O `<noscript>` abaixo não é enfeite: é o que
      um rastreador sem execução de JS enxerga, e por isso ele carrega o texto
      de verdade, não um aviso.

      COM Open Graph, e isso MUDOU. Até a #138 esta página não tinha nenhuma tag
      `og:`, com o argumento de que quem compartilha o Auê manda o link do jogo.
      Só que ela é linkada da landing de desktop e sai em busca — e sem as tags
      o WhatsApp montava o card lendo o `index.html` que a hospedagem devolve
      antes do rewrite: título, descrição e endereço de OUTRA página. Um link de
      manual chegando no grupo como se fosse a home é pior que um card feio.

      O `og:url` aponta para a PRÓPRIA rota, igual ao canonical, e
      `src/seo-publico.test.ts` trava os dois juntos. A imagem é a mesma
      `og-image.png` da home; imagem própria por página fica pro backlog.

      SEM JSON-LD aqui, de propósito: os dados estruturados descrevem o
      aplicativo, e o aplicativo é a home. Declarar de novo no manual seria a
      mesma entidade em duas URLs.
    -->
    <meta
      name="description"
      content="Como jogar o Auê, o jogo de arroto online: arrote no celular, receba uma nota de 0 a 100 e desafie os amigos por link. Grátis, direto no navegador, sem instalar e sem cadastro."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://aue.web.app/como-jogar" />

    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Auê" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://aue.web.app/como-jogar" />
    <meta property="og:title" content="Como jogar o Auê! — jogo de arroto online" />
    <meta property="og:description" content="Arrota no celular, recebe uma nota de 0 a 100 e chama os amigos pro X1 por link. Grátis, direto no navegador, sem instalar e sem cadastro." />
    <meta property="og:image" content="https://aue.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Símbolo do Auê: uma bolha verde-limão com um ponto de exclamação vazado." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Como jogar o Auê! — jogo de arroto online" />
    <meta name="twitter:description" content="Arrota no celular, recebe uma nota de 0 a 100 e chama os amigos pro X1 por link. Grátis, direto no navegador, sem instalar e sem cadastro." />
    <meta name="twitter:image" content="https://aue.web.app/og-image.png" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Auê" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Como jogar o Auê</h1>
      <p>
        O Auê é um jogo de arroto online. Você arrota no celular, ele ouve e
        devolve uma nota de 0 a 100 — analisando duração, potência,
        profundidade e textura do som. Não é sorteio: o que não for arroto não
        vira nota.
      </p>

      <h2>Arrotar e receber a nota</h2>
      <p>
        Abra o Auê, toque em ARROTAR e solte. O jogo pede o microfone na hora
        do toque, grava, julga e mostra a nota com as quatro medidas. Se não
        gostou do número, é só mandar outro.
      </p>

      <h2>Desafiar um amigo</h2>
      <p>
        Depois da nota, chame alguém para o X1. O Auê gera um link privado:
        quem abrir ouve o seu arroto, arrota a resposta no próprio aparelho e
        as duas notas se enfrentam. No fim tem placar, e tem revanche. É a
        competição de arroto resolvida no grupo do WhatsApp.
      </p>

      <h2>Funciona direto no navegador</h2>
      <p>
        Não precisa instalar nada. O Auê abre no navegador do celular — Android
        ou iPhone — e quem recebe o desafio joga pelo mesmo link, sem baixar
        app e sem criar conta.
      </p>

      <h2>É de graça</h2>
      <p>
        Jogar o Auê não custa nada: não tem assinatura, não tem moeda dentro do
        jogo e não tem cadastro. Lá fora esse tipo de jogo é chamado de
        <em>burp game</em>; aqui é só o Auê.
      </p>

      <p><a href="/">Jogar agora</a> · <a href="/privacidade">Política de privacidade</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
