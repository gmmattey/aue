<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Como jogar o Auê! — competição de arroto online</title>

    <meta name="theme-color" content="#0a0a08" />

    <!--
      POR QUE ESTA PÁGINA EXISTE, E POR QUE ELA TEM HTML PRÓPRIO

      A home é a Arena: uma superfície de estado, que só existe depois que o
      JavaScript roda e que não tem texto explicando o produto — nem deve ter,
      porque explicar no meio do jogo é atrito.

      Esta página é o único lugar público onde o Auê se explica por escrito: o
      que é, como se joga, que roda no navegador e que é de graça. Serve para
      quem chegou pelo buscador sem saber o que vai encontrar, e serve para o
      próprio buscador entender a categoria do produto.

      O HTML de entrada é o mesmo mecanismo de `privacidade.html` e
      `termos.html`, e pelo mesmo motivo: `vercel.json` reescreve qualquer
      caminho para o `index.html`, então sem esta entrada a URL seria servida
      com o `<title>`, a descrição e o `canonical` da HOME — e o sitemap, que
      declara `/como-jogar` como indexável, estaria brigando com o canonical.
      Nessa briga o canonical ganha e a página some do índice.

      LIMITE DECLARADO, igual às outras: isto NÃO é prerender. O conteúdo
      completo é montado pelo React (`src/features/publico/ComoJogar.tsx`) e
      só aparece com JavaScript. O `<noscript>` abaixo não é enfeite: é o que
      um rastreador sem execução de JS enxerga, e por isso ele carrega o texto
      de verdade, não um aviso.

      SEM Open Graph e SEM JSON-LD aqui, de propósito: quem compartilha o Auê
      manda o link do jogo ou o link da batalha, não o do manual. Cada bloco
      desses seria mais um lugar onde o domínio pode envelhecer sem ninguém
      notar.
    -->
    <meta
      name="description"
      content="Como jogar a competição de arroto do Auê: arrote, receba uma nota de 0 a 100, transforme a nota em placar e desafie os amigos no X1. Grátis, direto no navegador e sem cadastro."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://aue.vercel.app/como-jogar" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Auê" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Como funciona a competição de arroto do Auê</h1>
      <p>
        O Auê é uma competição de arroto que roda direto no navegador. Você
        arrota, recebe uma nota de 0 a 100 e usa esse número como placar para
        desafiar outra pessoa. A maior nota leva o round.
      </p>

      <h2>1. Arrota</h2>
      <p>
        Abra o Auê, toque em ARROTAR e solte. O microfone é pedido nessa hora.
        Se o jogo validar o som, ele segue para o julgamento.
      </p>

      <h2>2. A nota vira placar</h2>
      <p>
        O Auê usa as características do som para chegar numa nota de 0 a 100.
        Pra quem joga, a regra é simples: esse número vira o alvo que o próximo
        precisa bater. Fez 94? O outro precisa de 95.
      </p>

      <h2>3. Chama alguém pro X1</h2>
      <p>
        Depois da nota, mande o desafio. O Auê gera um link: quem abrir ouve o
        seu arroto, grava a resposta no próprio aparelho e coloca a nota dele
        contra a sua. Não precisa criar conta, procurar sala nem combinar horário.
      </p>

      <h2>4. Perdeu? Revanche.</h2>
      <p>
        No fim tem placar. Quem fizer a maior nota leva o round. Se ficou feio,
        peça revanche e tente de novo.
      </p>

      <h2>Direto no navegador e de graça</h2>
      <p>
        O Auê abre no navegador do celular — Android ou iPhone — e quem recebe
        o desafio joga pelo mesmo link, sem baixar app, sem assinatura e sem
        cadastro na frente.
      </p>

      <p><a href="/">Entrar na competição</a> · <a href="/privacidade">Política de privacidade</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
