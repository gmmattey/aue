      <h1>Como funciona a competição de arroto do Auê</h1>
      <p>
        O Auê é uma competição de arroto que roda direto no navegador. Você
        arrota, recebe uma nota de 0 a 100 e usa esse número como placar para
        desafiar outra pessoa. A maior nota leva o round.
      </p>

      <h2>1. Arrota</h2>
      <p>
        Abra o Auê, toque em ARROTAR e solte. O microfone é pedido nessa hora.
        Se o jogo validar o som, ele segue para o julgamento.
      </p>

      <h2>2. A nota vira placar</h2>
      <p>
        O Auê usa as características do som para chegar numa nota de 0 a 100.
        Pra quem joga, a regra é simples: esse número vira o alvo que o próximo
        precisa bater. Fez 94? O outro precisa de 95.
      </p>

      <h2>3. Chama alguém pro X1</h2>
      <p>
        Depois da nota, mande o desafio. O Auê gera um link: quem abrir ouve o
        seu arroto, grava a resposta no próprio aparelho e coloca a nota dele
        contra a sua. Não precisa criar conta, procurar sala nem combinar horário.
      </p>

      <h2>4. Perdeu? Revanche.</h2>
      <p>
        No fim tem placar. Quem fizer a maior nota leva o round. Se ficou feio,
        peça revanche e tente de novo.
      </p>

      <h2>Direto no navegador e de graça</h2>
      <p>
        O Auê abre no navegador do celular — Android ou iPhone — e quem recebe
        o desafio joga pelo mesmo link, sem baixar app, sem assinatura e sem
        cadastro na frente.
      </p>
