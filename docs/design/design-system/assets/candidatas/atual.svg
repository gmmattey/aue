<!--
  O SÍMBOLO ANTIGO, guardado para comparação.

  Este arquivo NÃO é gerado e não deve ser regenerado: ele é o registro do que a
  marca era antes da varredura — cinco cúbicas escritas à mão que na prática
  liam como círculo, com a haste e o pingo do "!" se tocando. É o "antes" das
  figuras do `favicon-set.html`.

  Única diferença em relação ao arquivo original: o pingo, que lá era um arco
  elíptico (`a16,16 …`), está aqui como as quatro cúbicas equivalentes — é o
  vocabulário que o `build-favicons.py` lê. Mesmo círculo, centro (120,150),
  raio 16.
-->
