<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Seu resultado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
    --radius:18px; --radius-lg:24px;
    --gap-xs:8px; --gap-sm:12px; --gap-md:20px; --gap-lg:32px; --gap-xl:48px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1,h2{margin:0;text-wrap:balance;}
  p{margin:0;text-wrap:pretty;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .appbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 4px;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}

  .screen{flex:1;overflow-y:auto;padding:6px 20px 28px;display:flex;flex-direction:column;gap:26px;}

  .score-block{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:4px;}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .score-num{font-family:var(--font-display);font-size:104px;line-height:.86;color:var(--accent);animation:score-in .4s cubic-bezier(.2,0,0,1) .15s both;}
  .score-classification{font-family:var(--font-display);font-size:23px;text-transform:uppercase;letter-spacing:.01em;animation:fade-up .35s cubic-bezier(.2,0,0,1) .3s both;}
  .xp-pill{margin-top:10px;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;animation:fade-up .35s cubic-bezier(.2,0,0,1) .4s both;}
  @keyframes score-in{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
  @keyframes fade-up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .score-num,.score-classification,.xp-pill{animation:none;} }

  .quote{font-family:var(--font-display);font-size:20px;line-height:1.3;text-align:center;color:var(--fg);max-width:26ch;margin:0 auto;text-transform:none;}
  .quote-mark{font-family:var(--font-display);font-size:56px;line-height:.6;color:var(--accent);opacity:.3;display:block;text-align:center;margin-bottom:-6px;}

  .metrics{display:flex;flex-direction:column;}
  .metric-row{display:flex;flex-direction:column;gap:7px;padding:13px 0;border-top:1px solid var(--border);}
  .metric-row:first-child{border-top:none;}
  .metric-head{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);}
  .metric-head b{font-family:var(--font-mono);color:var(--fg);font-weight:600;}
  .track{height:8px;border-radius:999px;background:var(--border);overflow:hidden;}
  .fill{height:100%;border-radius:999px;background:var(--accent);}

  .actions{display:flex;flex-direction:column;gap:12px;padding-top:4px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:17px 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent;width:100%;transition:background-color .15s ease,border-color .15s ease;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:color-mix(in oklch, var(--accent) 88%, white);}
  .btn-secondary{background:transparent;color:var(--fg);border-color:var(--border);}
  .btn-secondary:hover{border-color:var(--fg);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn-secondary{flex:1;}
  .btn-ghost{background:none;color:var(--muted);font-weight:600;text-transform:none;text-align:center;padding:4px;}
  .btn-ghost:hover{color:var(--fg);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-resultado">
  <header class="appbar" data-od-id="appbar">
    <a class="icon-btn" href="home.html" aria-label="Fechar" data-od-id="close-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
    <button class="icon-btn" aria-label="Compartilhar" data-od-id="share-icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-3.9M8.6 13.5l6.8 3.9"/></svg>
    </button>
  </header>

  <main class="screen">
    <section class="score-block" data-od-id="score-hero">
      <p class="eyebrow">Seu Auê</p>
      <div class="score-num" data-od-id="score-value">91,4</div>
      <h1 class="score-classification" data-od-id="score-classification">Monstro do Esgoto</h1>
      <span class="xp-pill" data-od-id="xp-pill">+40 XP</span>
    </section>

    <section data-od-id="judge-quote">
      <span class="quote-mark">"</span>
      <p class="quote">Tecnicamente excelente. Socialmente indefensável.</p>
    </section>

    <section class="metrics" data-od-id="metrics">
      <div class="metric-row">
        <div class="metric-head"><span>Profundidade</span><b>92</b></div>
        <div class="track"><div class="fill" style="width:92%"></div></div>
      </div>
      <div class="metric-row">
        <div class="metric-head"><span>Potência</span><b>88</b></div>
        <div class="track"><div class="fill" style="width:88%"></div></div>
      </div>
      <div class="metric-row">
        <div class="metric-head"><span>Duração</span><b>76</b></div>
        <div class="track"><div class="fill" style="width:76%"></div></div>
      </div>
      <div class="metric-row">
        <div class="metric-head"><span>Textura</span><b>84</b></div>
        <div class="track"><div class="fill" style="width:84%"></div></div>
      </div>
    </section>

    <section class="actions" data-od-id="result-actions">
      <button class="btn btn-primary" data-od-id="btn-desafiar">Desafiar um amigo</button>
      <div class="btn-row">
        <a class="btn btn-secondary" href="compartilhar.html" data-od-id="btn-compartilhar">Compartilhar</a>
        <a class="btn btn-secondary" href="gravacao.html" data-od-id="btn-tentar-de-novo">Tentar de novo</a>
      </div>
    </section>
  </main>
</div>
</body>
</html>
