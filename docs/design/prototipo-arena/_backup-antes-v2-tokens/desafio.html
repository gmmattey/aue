<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Você foi desafiado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
    --radius:18px; --radius-lg:24px;
    --gap-xs:8px; --gap-sm:12px; --gap-md:20px; --gap-lg:32px; --gap-xl:48px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;text-wrap:balance;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .appbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 4px;}
  .brand{font-family:var(--font-display);font-size:21px;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}

  .screen{flex:1;display:flex;flex-direction:column;padding:8px 20px 24px;gap:26px;}

  .head{text-align:center;display:flex;flex-direction:column;gap:8px;padding-top:4px;}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .h1{font-family:var(--font-display);font-size:clamp(28px,7vw,34px);text-transform:uppercase;line-height:1.06;}

  .vs-wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;}
  .vs-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
  .vs-card.pending{border-style:dashed;}
  .avatar{width:52px;height:52px;border-radius:999px;background:var(--border);display:grid;place-items:center;font-family:var(--font-display);font-size:19px;}
  .vs-name{font-size:13px;font-weight:600;}
  .vs-score{font-family:var(--font-display);font-size:34px;color:var(--accent);line-height:1;}
  .vs-score.muted{color:var(--muted);}
  .vs-class{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .vs-label{font-family:var(--font-display);font-size:16px;color:var(--muted);text-align:center;}

  .sub{text-align:center;font-family:var(--font-display);font-size:22px;text-transform:uppercase;letter-spacing:.01em;padding-top:4px;}

  .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:17px 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent;width:100%;transition:background-color .15s ease,border-color .15s ease;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:color-mix(in oklch, var(--accent) 88%, white);}
  .note{font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-desafio">
  <header class="appbar" data-od-id="appbar">
    <span class="brand">Auê!</span>
    <span style="width:44px"></span>
  </header>

  <main class="screen">
    <section class="head" data-od-id="challenge-headline">
      <p class="eyebrow">Desafio recebido</p>
      <h1 class="h1">Luiz te desafiou</h1>
    </section>

    <section class="vs-wrap" data-od-id="vs-comparison">
      <div class="vs-card" data-od-id="vs-challenger">
        <div class="avatar">L</div>
        <span class="vs-name">Luiz</span>
        <span class="vs-score">91,4</span>
        <span class="vs-class">Monstro do Esgoto</span>
      </div>
      <span class="vs-label">VS</span>
      <div class="vs-card pending" data-od-id="vs-you">
        <div class="avatar">?</div>
        <span class="vs-name">Você</span>
        <span class="vs-score muted">?</span>
        <span class="vs-class">Sua vez</span>
      </div>
    </section>

    <p class="sub" data-od-id="challenge-question">Você consegue bater?</p>

    <div class="foot">
      <a class="btn btn-primary" href="permissao.html" data-od-id="btn-arrotar-agora">Arrotar agora</a>
      <span class="note" data-od-id="no-signup-note">Sem cadastro.</span>
    </div>
  </main>
</div>
</body>
</html>
