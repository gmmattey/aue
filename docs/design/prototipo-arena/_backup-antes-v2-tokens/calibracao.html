<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Calibrando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;text-wrap:balance;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }
  @media (prefers-reduced-motion: reduce){ .pulse-ring{animation:none;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .appbar{display:flex;align-items:center;padding:20px;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}

  .screen{flex:1;display:flex;flex-direction:column;padding:8px 24px 24px;}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;}
  .ring-wrap{position:relative;width:120px;height:120px;display:grid;place-items:center;}
  .pulse-ring{position:absolute;inset:0;border-radius:999px;border:1px solid var(--accent-soft);animation:pulse-scale 1.6s cubic-bezier(0,0,.2,1) infinite;}
  .pulse-ring.r2{animation-delay:.5s;}
  @keyframes pulse-scale{0%{transform:scale(.7);opacity:.9;}100%{transform:scale(1.3);opacity:0;}}
  .ring-core{width:64px;height:64px;border-radius:999px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;}
  .ring-core svg{width:26px;height:26px;color:var(--accent);}

  .h1{font-family:var(--font-display);font-size:clamp(40px,10vw,52px);text-transform:uppercase;letter-spacing:.06em;}
  .sub{color:var(--muted);font-size:14px;max-width:30ch;line-height:1.5;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;}

  .foot{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:12px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:17px 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent;width:100%;transition:background-color .15s ease,border-color .15s ease;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:color-mix(in oklch, var(--accent) 88%, white);}
  .foot-note{font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-calibracao">
  <header class="appbar" data-od-id="appbar">
    <a class="icon-btn" href="permissao.html" aria-label="Voltar" data-od-id="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
  </header>

  <main class="screen">
    <section class="center" data-od-id="calibration-hero">
      <div class="ring-wrap" aria-hidden="true">
        <div class="pulse-ring"></div>
        <div class="pulse-ring r2"></div>
        <div class="ring-core">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/></svg>
        </div>
      </div>
      <h1 class="h1">Xiu.</h1>
      <p class="sub">Medindo o silêncio...</p>
    </section>

    <div class="foot">
      <a class="btn btn-primary" href="gravacao.html" data-od-id="btn-comecar-gravar">Começar a gravar</a>
      <span class="foot-note">Normalmente isso leva menos de 1 segundo.</span>
    </div>
  </main>
</div>
</body>
</html>
