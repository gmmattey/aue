<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Confirmar idade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
    --radius:18px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;text-wrap:balance;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .screen{flex:1;display:flex;flex-direction:column;padding:24px;}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;}
  .brand{font-family:var(--font-display);font-size:22px;letter-spacing:.02em;}
  .h1{font-family:var(--font-display);font-size:clamp(24px,6.5vw,28px);text-transform:uppercase;letter-spacing:.06em;max-width:18ch;margin-top:6px;}
  .sub{color:var(--muted);font-size:14px;max-width:32ch;line-height:1.5;}

  .field{width:100%;max-width:280px;display:flex;flex-direction:column;gap:8px;text-align:left;margin-top:8px;}
  .field label{font-size:13px;font-weight:600;color:var(--fg);}
  .input{width:100%;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--fg);font:inherit;font-size:15px;color-scheme:dark;}
  .input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}

  .legal{font-size:11.5px;color:var(--muted);line-height:1.5;max-width:32ch;}
  .legal a{text-decoration:underline;text-underline-offset:2px;}
  .legal a:hover{color:var(--fg);}

  .foot{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:16px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:17px 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent;width:100%;transition:background-color .15s ease,border-color .15s ease;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:color-mix(in oklch, var(--accent) 88%, white);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-idade">
  <main class="screen">
    <section class="center" data-od-id="age-gate-hero">
      <span class="brand">Auê!</span>
      <h1 class="h1">Antes de começar, quantos anos você tem?</h1>
      <p class="sub">Precisamos confirmar sua idade pra liberar o app — é rapidinho.</p>

      <div class="field" data-od-id="field-nascimento">
        <label for="nascimento">Data de nascimento</label>
        <input class="input" id="nascimento" type="date" data-od-id="input-nascimento" />
      </div>

      <p class="legal" data-od-id="age-gate-legal">Ao continuar, você confirma que tem pelo menos 13 anos e concorda com os <a href="#" data-od-id="link-termos">Termos</a> e a <a href="#" data-od-id="link-privacidade">Política de Privacidade</a>.</p>
    </section>

    <div class="foot">
      <a class="btn btn-primary" href="login.html" data-od-id="btn-confirmar-idade">Confirmar</a>
    </div>
  </main>
</div>
</body>
</html>
