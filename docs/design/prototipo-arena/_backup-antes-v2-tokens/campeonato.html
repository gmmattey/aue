<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Campeão do Auê</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
    --radius:18px; --radius-lg:24px;
    --gap-xs:8px; --gap-sm:12px; --gap-md:20px; --gap-lg:32px; --gap-xl:48px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1,h2{margin:0;text-wrap:balance;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .appbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 4px;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}

  .screen{flex:1;overflow-y:auto;padding:6px 20px 24px;display:flex;flex-direction:column;gap:24px;}

  .champion{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding-top:4px;}
  .trophy{width:52px;height:52px;color:var(--accent);}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .h1{font-family:var(--font-display);font-size:clamp(26px,7vw,32px);text-transform:uppercase;}
  .champion-avatar{width:84px;height:84px;border-radius:999px;background:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-size:32px;color:var(--bg);margin-top:6px;animation:champion-in .4s cubic-bezier(.2,0,0,1) .15s both;}
  .champion-name{font-family:var(--font-display);font-size:24px;text-transform:uppercase;margin-top:6px;animation:fade-up .35s cubic-bezier(.2,0,0,1) .35s both;}
  @keyframes champion-in{from{opacity:0;transform:scale(.85);}to{opacity:1;transform:scale(1);}}
  @keyframes fade-up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .champion-avatar,.champion-name,.champion-score{animation:none;} }
  .champion-score{font-family:var(--font-mono);font-size:20px;color:var(--accent);font-weight:700;animation:fade-up .35s cubic-bezier(.2,0,0,1) .45s both;}

  .roast{font-family:var(--font-display);font-size:18px;text-align:center;color:var(--fg);max-width:26ch;margin:0 auto;text-transform:none;line-height:1.3;}

  .podium-list{display:flex;flex-direction:column;}
  .podium-row{display:flex;align-items:center;gap:14px;padding:11px 10px;border-top:1px solid var(--border);}
  .podium-row:first-child{border-top:none;}
  .medal{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;font-weight:700;background:var(--surface);border:1px solid var(--border);color:var(--fg);flex-shrink:0;}
  .avatar{width:38px;height:38px;border-radius:999px;background:var(--border);display:grid;place-items:center;font-family:var(--font-display);font-size:14px;flex-shrink:0;}
  .podium-info{flex:1;}
  .podium-name{font-weight:600;font-size:14px;}
  .podium-score{font-family:var(--font-mono);font-weight:600;font-size:15px;color:var(--muted);}

  .actions{display:flex;flex-direction:column;gap:12px;margin-top:auto;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:17px 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent;width:100%;transition:background-color .15s ease,border-color .15s ease;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:color-mix(in oklch, var(--accent) 88%, white);}
  .btn-secondary{background:transparent;color:var(--fg);border-color:var(--border);}
  .btn-secondary:hover{border-color:var(--fg);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-campeonato">
  <header class="appbar" data-od-id="appbar">
    <a class="icon-btn" href="home.html" aria-label="Fechar" data-od-id="close-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
    <span style="width:44px"></span>
  </header>

  <main class="screen">
    <section class="champion" data-od-id="champion-hero">
      <svg class="trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M6 4h12v3a6 6 0 0 1-12 0V4Z"/><path d="M6 5H3v2a3 3 0 0 0 3 3M18 5h3v2a3 3 0 0 1-3 3"/></svg>
      <p class="eyebrow">Fim de jogo</p>
      <h1 class="h1">Campeão do Auê</h1>
      <div class="champion-avatar">C</div>
      <div class="champion-name">Carol</div>
      <div class="champion-score">98,1</div>
    </section>

    <p class="roast" data-od-id="roast-line">Tecnicamente excelente. Socialmente indefensável.</p>

    <section class="podium-list" data-od-id="podium-list">
      <div class="podium-row" data-od-id="podium-row-2">
        <span class="medal">2</span>
        <div class="avatar">B</div>
        <div class="podium-info"><div class="podium-name">Bruno</div></div>
        <div class="podium-score">95,6</div>
      </div>
      <div class="podium-row" data-od-id="podium-row-3">
        <span class="medal">3</span>
        <div class="avatar">R</div>
        <div class="podium-info"><div class="podium-name">Rafa</div></div>
        <div class="podium-score">93,0</div>
      </div>
      <div class="podium-row" data-od-id="podium-row-4">
        <span class="medal">4</span>
        <div class="avatar">V</div>
        <div class="podium-info"><div class="podium-name">Você</div></div>
        <div class="podium-score">87,4</div>
      </div>
    </section>

    <div class="actions">
      <a class="btn btn-primary" href="compartilhar.html" data-od-id="btn-compartilhar-resultado">Compartilhar resultado</a>
      <a class="btn btn-secondary" href="campeonato-lobby.html" data-od-id="btn-nova-rodada">Nova rodada</a>
    </div>
  </main>
</div>
</body>
</html>
