<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Galera do Escritório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
    --radius:18px; --radius-lg:24px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .appbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px;gap:12px;}
  .appbar-id{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .h1{font-family:var(--font-display);font-size:20px;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .appbar-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);flex-shrink:0;transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}

  .screen{flex:1;overflow-y:auto;padding:0 20px 24px;}

  .post{padding:18px 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:14px;}
  .post:first-child{border-top:none;}
  .post-head{display:flex;align-items:center;gap:12px;}
  .avatar{width:40px;height:40px;border-radius:999px;background:var(--border);display:grid;place-items:center;font-family:var(--font-display);font-size:15px;flex-shrink:0;}
  .post-meta{flex:1;min-width:0;}
  .post-name{font-weight:600;font-size:14px;}
  .post-time{font-size:12px;color:var(--muted);}

  .post-result{display:flex;align-items:baseline;gap:10px;}
  .post-score{font-family:var(--font-mono);font-size:30px;font-weight:700;color:var(--accent);line-height:1;}
  .post-class{font-family:var(--font-display);font-size:14px;text-transform:uppercase;letter-spacing:.01em;}

  .post-actions{display:flex;align-items:center;gap:8px;}
  .action-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;min-height:44px;border-radius:999px;border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;transition:border-color .15s ease,color .15s ease,background-color .15s ease;}
  .action-btn svg{width:16px;height:16px;}
  .action-btn:hover{border-color:var(--fg);color:var(--fg);}
  .action-btn.like.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .action-btn.dislike.active{border-color:var(--fg);color:var(--fg);background:var(--fg-soft);}
  .action-btn.comment{margin-left:auto;}

  footer.legend{margin-top:8px;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);text-align:center;}

  .ad-slot{margin-top:14px;padding:18px;border:1px dashed var(--border);border-radius:18px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:100px;text-align:center;}
  .ad-slot-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .ad-slot-note{font-size:11.5px;color:var(--muted);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-comunidade">
  <header class="appbar" data-od-id="appbar">
    <a class="icon-btn" href="comunidades.html" aria-label="Voltar" data-od-id="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="appbar-id" data-od-id="community-identity">
      <h1 class="h1">Galera do Escritório</h1>
      <span class="appbar-sub">148 membros</span>
    </div>
    <a class="icon-btn" href="comunidade-criar.html" aria-label="Criar comunidade" data-od-id="create-community-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </header>

  <main class="screen" data-od-id="community-feed">
    <div class="ad-slot" data-od-id="ad-slot-feed-top" role="complementary" aria-label="Anúncio">
      <span class="ad-slot-label">Anúncio</span>
      <span class="ad-slot-note">Espaço reservado — AdSense in-feed 320×100</span>
    </div>

    <article class="post" data-od-id="post-carol">
      <div class="post-head">
        <div class="avatar">C</div>
        <div class="post-meta">
          <div class="post-name">Carol</div>
          <div class="post-time">há 8 min</div>
        </div>
      </div>
      <div class="post-result">
        <span class="post-score">98,1</span>
        <span class="post-class">Deus do Auê</span>
      </div>
      <div class="post-actions">
        <button class="action-btn like active" data-od-id="post-carol-like">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11M2 13v6a2 2 0 0 0 2 2h12.5a2 2 0 0 0 2-1.6l1.2-7A2 2 0 0 0 17.7 10H13V5a2 2 0 0 0-2-2L7 10Z"/></svg>
          32
        </button>
        <button class="action-btn dislike" data-od-id="post-carol-dislike">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V3M22 11V5a2 2 0 0 0-2-2H7.5a2 2 0 0 0-2 1.6l-1.2 7A2 2 0 0 0 6.3 14H11v5a2 2 0 0 0 2 2l4-7Z"/></svg>
          1
        </button>
        <a class="action-btn comment" href="comunidade-comentarios.html#carol" data-od-id="post-carol-comment">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
          6
        </a>
      </div>
    </article>

    <article class="post" data-od-id="post-bruno">
      <div class="post-head">
        <div class="avatar">B</div>
        <div class="post-meta">
          <div class="post-name">Bruno</div>
          <div class="post-time">há 22 min</div>
        </div>
      </div>
      <div class="post-result">
        <span class="post-score">95,6</span>
        <span class="post-class">Mestre Arrotador</span>
      </div>
      <div class="post-actions">
        <button class="action-btn like" data-od-id="post-bruno-like">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11M2 13v6a2 2 0 0 0 2 2h12.5a2 2 0 0 0 2-1.6l1.2-7A2 2 0 0 0 17.7 10H13V5a2 2 0 0 0-2-2L7 10Z"/></svg>
          19
        </button>
        <button class="action-btn dislike" data-od-id="post-bruno-dislike">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V3M22 11V5a2 2 0 0 0-2-2H7.5a2 2 0 0 0-2 1.6l-1.2 7A2 2 0 0 0 6.3 14H11v5a2 2 0 0 0 2 2l4-7Z"/></svg>
          0
        </button>
        <a class="action-btn comment" href="comunidade-comentarios.html#bruno" data-od-id="post-bruno-comment">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
          2
        </a>
      </div>
    </article>

    <article class="post" data-od-id="post-pedro">
      <div class="post-head">
        <div class="avatar">P</div>
        <div class="post-meta">
          <div class="post-name">Pedro</div>
          <div class="post-time">há 1 h</div>
        </div>
      </div>
      <div class="post-result">
        <span class="post-score">41,2</span>
        <span class="post-class">Tentativa Honesta</span>
      </div>
      <div class="post-actions">
        <button class="action-btn like" data-od-id="post-pedro-like">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11M2 13v6a2 2 0 0 0 2 2h12.5a2 2 0 0 0 2-1.6l1.2-7A2 2 0 0 0 17.7 10H13V5a2 2 0 0 0-2-2L7 10Z"/></svg>
          4
        </button>
        <button class="action-btn dislike active" data-od-id="post-pedro-dislike">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V3M22 11V5a2 2 0 0 0-2-2H7.5a2 2 0 0 0-2 1.6l-1.2 7A2 2 0 0 0 6.3 14H11v5a2 2 0 0 0 2 2l4-7Z"/></svg>
          7
        </button>
        <a class="action-btn comment" href="comunidade-comentarios.html#pedro" data-od-id="post-pedro-comment">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
          11
        </a>
      </div>
    </article>

    <footer class="legend" data-od-id="feed-end">Você chegou ao fim. Vai lá arrotar mais.</footer>
  </main>
</div>
</body>
</html>
