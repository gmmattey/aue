<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Nova comunidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
    --radius:18px; --radius-lg:24px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .appbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 4px;}
  .h1{font-family:var(--font-display);font-size:20px;text-transform:uppercase;letter-spacing:.01em;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}

  .screen{flex:1;overflow-y:auto;padding:20px 20px 24px;display:flex;flex-direction:column;gap:26px;}

  .avatar-picker{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px;}
  .avatar-pick-btn{width:84px;height:84px;border-radius:999px;background:var(--surface);border:1px dashed var(--border);display:grid;place-items:center;color:var(--muted);}
  .avatar-pick-btn svg{width:26px;height:26px;}
  .avatar-pick-label{font-size:12.5px;color:var(--muted);}

  .field{display:flex;flex-direction:column;gap:8px;}
  .field label{font-size:13px;font-weight:600;color:var(--fg);}
  .field .hint{font-size:12px;color:var(--muted);font-weight:400;}
  .input,.textarea{width:100%;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--fg);font:inherit;font-size:15px;}
  .input::placeholder,.textarea::placeholder{color:var(--muted);}
  .input:focus,.textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  .textarea{min-height:96px;resize:vertical;line-height:1.5;}
  .char-count{align-self:flex-end;font-family:var(--font-mono);font-size:11px;color:var(--muted);}

  .privacy{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;}
  .privacy-opt{flex:1;text-align:center;padding:11px 0;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);}
  .privacy-opt.active{background:var(--accent);color:var(--bg);}

  .foot{margin-top:auto;padding-top:8px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:17px 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent;width:100%;transition:background-color .15s ease,border-color .15s ease;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:color-mix(in oklch, var(--accent) 88%, white);}
  .btn-primary:disabled{background:var(--surface);color:var(--muted);border-color:var(--border);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-comunidade-criar">
  <header class="appbar" data-od-id="appbar">
    <a class="icon-btn" href="comunidades.html" aria-label="Cancelar" data-od-id="close-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
    <h1 class="h1">Nova comunidade</h1>
    <span style="width:44px"></span>
  </header>

  <main class="screen">
    <div class="avatar-picker" data-od-id="community-avatar-picker">
      <button class="avatar-pick-btn" aria-label="Escolher imagem da comunidade" data-od-id="avatar-pick-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-4-9 7"/></svg>
      </button>
      <span class="avatar-pick-label">Adicionar imagem (opcional)</span>
    </div>

    <div class="field" data-od-id="field-nome">
      <label for="nome-comunidade">Nome da comunidade</label>
      <input class="input" id="nome-comunidade" type="text" placeholder="Ex.: Galera do Escritório" maxlength="40" data-od-id="input-nome-comunidade" />
    </div>

    <div class="field" data-od-id="field-descricao">
      <label for="desc-comunidade">Descrição <span class="hint">· opcional</span></label>
      <textarea class="textarea" id="desc-comunidade" placeholder="Do que se trata essa comunidade?" maxlength="140" data-od-id="input-descricao-comunidade"></textarea>
      <span class="char-count" data-od-id="char-count">0/140</span>
    </div>

    <div class="field" data-od-id="field-privacidade">
      <label>Privacidade</label>
      <div class="privacy" data-od-id="privacy-toggle">
        <span class="privacy-opt active" data-od-id="privacy-publica">Pública</span>
        <span class="privacy-opt" data-od-id="privacy-convite">Por convite</span>
      </div>
    </div>

    <div class="foot">
      <a class="btn btn-primary" href="comunidade.html" data-od-id="btn-criar-comunidade">Criar comunidade</a>
    </div>
  </main>
</div>
</body>
</html>
