<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Gravando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
    --radius:18px; --radius-lg:24px;
    --gap-xs:8px; --gap-sm:12px; --gap-md:20px; --gap-lg:32px; --gap-xl:48px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;text-wrap:balance;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .appbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 4px;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}
  .rec-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  .rec-dot{width:7px;height:7px;border-radius:999px;background:var(--fg);animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  @media (prefers-reduced-motion: reduce){ .rec-dot{animation:none;} }

  .screen{flex:1;display:flex;flex-direction:column;padding:8px 20px 24px;}
  .rec-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;}
  .h1{font-family:var(--font-display);font-size:clamp(40px,10vw,52px);text-transform:uppercase;letter-spacing:.01em;}

  .bolha-wrap{position:relative;width:220px;height:220px;display:grid;place-items:center;}
  .bolha-ring{position:absolute;inset:0;border-radius:999px;border:1px solid var(--accent-soft);}
  .bolha-ring.r2{inset:-16px;opacity:.6;}
  .bolha{width:180px;height:180px;border-radius:47% 53% 61% 39% / 55% 45% 55% 45%;background:var(--accent);display:grid;place-items:center;}
  .bolha svg{width:56px;height:56px;color:var(--bg);}

  .timer{font-family:var(--font-mono);font-size:34px;font-weight:600;letter-spacing:.01em;font-variant-numeric:tabular-nums;}
  .timer .max{color:var(--muted);font-size:18px;}

  .waveform{display:flex;align-items:flex-end;gap:3px;height:28px;}
  .waveform span{width:3px;border-radius:2px;background:var(--border);}
  .waveform span:nth-child(odd){background:var(--muted);}
  .wf1{height:40%;}.wf2{height:70%;}.wf3{height:100%;}.wf4{height:55%;}.wf5{height:85%;}.wf6{height:30%;}.wf7{height:60%;}.wf8{height:45%;}.wf9{height:75%;}.wf10{height:35%;}

  .origin-pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--muted);transition:border-color .15s ease,color .15s ease;}
  .origin-pill:hover{border-color:var(--fg);color:var(--fg);}

  .foot{padding-top:20px;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:17px 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent;width:100%;transition:background-color .15s ease,border-color .15s ease;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:color-mix(in oklch, var(--accent) 88%, white);}
  .btn-ghost{background:none;color:var(--muted);font-weight:600;text-transform:none;padding:6px;}
  .btn-ghost:hover{color:var(--fg);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-gravacao">
  <header class="appbar" data-od-id="appbar">
    <a class="icon-btn" href="home.html" aria-label="Cancelar gravação" data-od-id="close-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
    <span class="rec-pill" data-od-id="rec-indicator"><span class="rec-dot"></span>Gravando</span>
    <span style="width:44px"></span>
  </header>

  <main class="screen">
    <section class="rec-center" data-od-id="recording-hero">
      <h1 class="h1">Manda.</h1>

      <div class="bolha-wrap" data-od-id="bolha-recording">
        <div class="bolha-ring"></div>
        <div class="bolha-ring r2"></div>
        <div class="bolha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4M9 22h6"/></svg>
        </div>
      </div>

      <div class="timer" data-od-id="rec-timer">02,7<span class="max">&nbsp;/ 10s</span></div>

      <div class="waveform" aria-hidden="true" data-od-id="waveform">
        <span class="wf1"></span><span class="wf2"></span><span class="wf3"></span><span class="wf4"></span><span class="wf5"></span>
        <span class="wf6"></span><span class="wf7"></span><span class="wf8"></span><span class="wf9"></span><span class="wf10"></span>
      </div>

      <a class="origin-pill" href="origem.html" data-od-id="origin-selected">💨 Puxei ar · trocar</a>
    </section>

    <div class="foot">
      <a class="btn btn-primary" href="origem.html" data-od-id="btn-finalizar">Finalizar</a>
      <a class="btn-ghost" href="home.html" data-od-id="btn-cancelar">Cancelar</a>
    </div>
  </main>
</div>
</body>
</html>
