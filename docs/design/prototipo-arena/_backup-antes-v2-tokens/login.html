<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
    --radius:18px; --radius-lg:24px;
    --gap-xs:8px; --gap-sm:12px; --gap-md:20px; --gap-lg:32px; --gap-xl:48px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;text-wrap:balance;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .screen{flex:1;display:flex;flex-direction:column;padding:0 24px;}

  .brand-block{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-bottom:24px;}
  .bolha{width:96px;height:96px;border-radius:58% 42% 63% 37% / 41% 57% 43% 59%;background:var(--accent);display:grid;place-items:center;}
  .bolha svg{width:32px;height:32px;color:var(--bg);}
  .brand{font-family:var(--font-display);font-size:32px;letter-spacing:.01em;text-transform:uppercase;}
  .tagline{color:var(--muted);font-size:14px;max-width:26ch;}

  .auth-block{padding-bottom:28px;display:flex;flex-direction:column;gap:12px;}
  .h1{font-family:var(--font-display);font-size:22px;text-transform:uppercase;text-align:center;margin-bottom:6px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 22px;border-radius:999px;font-weight:700;font-size:14.5px;letter-spacing:.02em;border:1px solid transparent;width:100%;transition:background-color .15s ease,border-color .15s ease;}
  .btn svg{width:18px;height:18px;flex-shrink:0;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:color-mix(in oklch, var(--accent) 88%, white);}
  .btn-secondary{background:transparent;color:var(--fg);border-color:var(--border);}
  .btn-secondary:hover{border-color:var(--fg);}

  .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:2px 0;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}

  .guest-note{text-align:center;font-size:12.5px;color:var(--muted);}
  .guest-note a{color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:2px;}

  .legal{padding:0 24px 28px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.5;}
  .legal a{text-decoration:underline;text-underline-offset:2px;color:var(--muted);}
  .legal a:hover{color:var(--fg);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-login">
  <main class="screen">
    <section class="brand-block" data-od-id="login-brand">
      <div class="bolha" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4M9 22h6"/></svg>
      </div>
      <h1 class="brand">Auê!</h1>
      <p class="tagline">Arrote. Seja julgado.</p>
    </section>

    <section class="auth-block" data-od-id="login-auth">
      <p class="h1">Entra nessa porra</p>

      <button class="btn btn-primary" data-od-id="btn-login-google">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg>
        Continuar com Google
      </button>
      <button class="btn btn-secondary" data-od-id="btn-login-tiktok">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3v10.5a3.5 3.5 0 1 1-3-3.46"/><path d="M15 3c.5 2.5 2.2 4 5 4.2"/></svg>
        Continuar com TikTok
      </button>
      <button class="btn btn-secondary" data-od-id="btn-login-x">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 16 16M20 4 4 20"/></svg>
        Continuar com X
      </button>

      <div class="divider">ou</div>

      <p class="guest-note" data-od-id="guest-note">Recebeu um desafio? <a href="desafio.html" data-od-id="link-guest-desafio">Sem cadastro.</a></p>
    </section>
  </main>

  <p class="legal" data-od-id="login-legal">Ao continuar, você aceita os <a href="#" data-od-id="link-termos">Termos</a> e a <a href="#" data-od-id="link-privacidade">Política de Privacidade</a>.</p>
</div>
</body>
</html>
