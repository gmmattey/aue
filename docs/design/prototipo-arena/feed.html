<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a08;--surface:#171712;--fg:#f5f3ea;--muted:#93917f;--border:#2b2a22;--accent:#c6ff00;--accent-soft:color-mix(in oklch,var(--accent) 14%,transparent);--font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;--font-mono:ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;--radius:24px;}
  *,*::before,*::after{box-sizing:border-box;} body{margin:0;background:var(--bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);} a{color:inherit;text-decoration:none;} button{font:inherit;cursor:pointer;background:none;border:0;color:inherit;} *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;} .appbar{display:flex;align-items:center;justify-content:space-between;padding:20px;gap:12px;border-bottom:1px solid var(--border);} .h1{font-family:var(--font-display);font-size:24px;text-transform:uppercase;letter-spacing:.06em;} .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);} .icon-btn svg{width:16px;height:16px;}
  .screen{flex:1;overflow-y:auto;padding:0 20px 24px;} .feed-filter{display:flex;gap:8px;overflow-x:auto;padding:14px 0 8px;scrollbar-width:none;} .feed-filter::-webkit-scrollbar{display:none;} .filter{flex-shrink:0;min-height:36px;padding:0 14px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:12px;font-weight:600;} .filter.active,.filter:hover{border-color:var(--fg);color:var(--fg);background:var(--surface);}
  .post{padding:18px 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:14px;} .post-head{display:flex;align-items:center;gap:12px;} .avatar{width:40px;height:40px;border-radius:999px;background:var(--border);display:grid;place-items:center;font-family:var(--font-display);font-size:15px;flex-shrink:0;} .post-meta{flex:1;min-width:0;} .post-name{font-size:14px;font-weight:600;} .post-time{font-size:12px;color:var(--muted);} .post-context{font-size:12px;color:var(--muted);} .post-result{display:flex;align-items:baseline;gap:10px;} .post-score{font-family:var(--font-mono);font-size:30px;font-weight:700;color:var(--accent);} .post-class{font-family:var(--font-display);font-size:14px;text-transform:uppercase;} .social-card{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);} .social-icon{width:32px;height:32px;border-radius:999px;background:var(--border);display:grid;place-items:center;font-family:var(--font-display);} .social-copy{display:flex;flex-direction:column;gap:2px;min-width:0;} .social-label{font-size:12px;font-weight:700;} .social-url{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .post-actions{display:flex;gap:8px;} .action{min-height:44px;padding:0 14px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:13px;font-weight:600;} .action:hover{border-color:var(--fg);color:var(--fg);} .comment{margin-left:auto;} footer{padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);text-align:center;}
  @media (min-width:560px){body{padding-block:32px;}.app-shell{min-height:844px;border:1px solid var(--border);border-radius:32px;}}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-feed">
  <header class="appbar" data-od-id="feed-appbar"><a class="icon-btn" href="comunidades.html" aria-label="Voltar" data-od-id="feed-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></a><h1 class="h1">Feed</h1><a class="icon-btn" href="perfil.html" aria-label="Abrir perfil" data-od-id="feed-profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></a></header>
  <main class="screen">
    <div class="feed-filter" data-od-id="feed-filter"><button class="filter active" type="button">Seguindo</button><button class="filter" type="button">Comunidades</button><button class="filter" type="button">Links sociais</button></div>
    <article class="post" data-od-id="feed-post-carol"><div class="post-head"><div class="avatar">C</div><div class="post-meta"><div class="post-name">Carol</div><div class="post-time">há 8 min · <span class="post-context">Galera do Escritório</span></div></div></div><div class="post-result"><span class="post-score">98,1</span><span class="post-class">Deus do Auê</span></div><div class="post-actions"><button class="action" type="button">32 curtidas</button><a class="action comment" href="comunidade-comentarios.html#carol" data-od-id="feed-comment-carol">Comentar</a></div></article>
    <article class="post" data-od-id="feed-post-social"><div class="post-head"><div class="avatar">B</div><div class="post-meta"><div class="post-name">Bruno</div><div class="post-time">há 22 min · <span class="post-context">Arrotadores Noturnos</span></div></div></div><div class="social-card"><div class="social-icon">◎</div><div class="social-copy"><span class="social-label">TikTok de Bruno</span><span class="social-url">tiktok.com/@bruno.arrota</span></div></div><div class="post-actions"><button class="action" type="button">19 curtidas</button><a class="action comment" href="comunidade-comentarios.html#bruno" data-od-id="feed-comment-bruno">Comentar</a></div></article>
    <article class="post" data-od-id="feed-post-pedro"><div class="post-head"><div class="avatar">P</div><div class="post-meta"><div class="post-name">Pedro</div><div class="post-time">há 1 h · <span class="post-context">Seguindo você</span></div></div></div><div class="post-result"><span class="post-score">41,2</span><span class="post-class">Tentativa Honesta</span></div><div class="post-actions"><button class="action" type="button">4 curtidas</button><a class="action comment" href="comunidade-comentarios.html#pedro" data-od-id="feed-comment-pedro">Comentar</a></div></article>
    <footer data-od-id="feed-end">Você chegou ao fim. A dignidade também.</footer>
  </main>
</div>
<script>document.querySelectorAll('.filter').forEach((button)=>button.addEventListener('click',()=>document.querySelectorAll('.filter').forEach((item)=>item.classList.toggle('active',item===button))));</script>
</body>
</html>
