<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auê! · Sessão expirada</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#0a0a08;--surface:#171712;--fg:#f5f3ea;--muted:#93917f;--border:#2b2a22;--accent:#c6ff00;--d:'Anton',Impact,sans-serif;--b:'Inter',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--b)}.app{min-height:100dvh;max-width:440px;margin:auto;padding:24px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between}.mark{font:28px var(--d);letter-spacing:.08em}.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.1em;text-transform:uppercase}.h1{font:clamp(30px,8vw,40px) var(--d);text-transform:uppercase;letter-spacing:.05em;max-width:11ch}.sub{color:var(--muted);line-height:1.5}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;font-weight:700;text-transform:uppercase;text-decoration:none}.primary{background:var(--accent);color:var(--bg)}.ghost{color:var(--muted);border:1px solid var(--border)}*:focus-visible{outline:3px solid var(--accent);outline-offset:3px}</style></head><body><main class="app" data-od-id="screen-sessao-expirada"><header class="top"><span class="mark">Auê!</span></header><section class="screen"><p class="eyebrow">Estado do duelo</p><h1 class="h1">Esse link já deu o que tinha que dar.</h1><p class="sub">A sessão expirou ou a disputa já foi encerrada. Crie outra e manda de novo.</p><a class="btn primary" href="desafio-criar.html" data-od-id="btn-novo-desafio">Criar novo desafio</a><a class="btn ghost" href="home.html" data-od-id="btn-inicio">Voltar ao início</a></section></main></body></html>
