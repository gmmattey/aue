<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Sem conexão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --surface-2:#1f1f18; --accent-strong:#a8d900; --accent-on:#0a0a08; --gold:#f4c430; --gold-strong:#d9ac1c; --danger:#ff3d3f; --danger-strong:#e11a1c; --silver:#c7cad1; --bronze:#c98a4b;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow:hidden;}
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);}
  }

  /* fundo: tela de resultado, apagada — mostra que o app continua rodando por trás do aviso */
  .backdrop{flex:1;display:flex;flex-direction:column;filter:blur(1px) brightness(.45);pointer-events:none;user-select:none;padding:20px;}
  .backdrop .score-num{font-family:var(--font-display);font-size:96px;line-height:.86;color:var(--accent);text-align:center;margin-top:40px;}
  .backdrop .score-class{font-family:var(--font-display);font-size:20px;text-transform:uppercase;text-align:center;margin-top:6px;}

  .banner{position:absolute;left:16px;right:16px;top:20px;display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 40px -16px rgba(0,0,0,.6);animation:banner-in .3s cubic-bezier(.2,0,0,1) both;}
  @keyframes banner-in{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .banner{animation:none;} }
  .banner-icon{width:36px;height:36px;border-radius:999px;background:var(--bg);border:1px solid var(--border);display:grid;place-items:center;flex-shrink:0;color:var(--muted);}
  .banner-icon svg{width:16px;height:16px;}
  .banner-title{font-family:var(--font-display);font-size:14px;text-transform:uppercase;letter-spacing:.04em;}
  .banner-sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4;}

  .foot{position:absolute;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:17px 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:1px solid var(--border);width:100%;color:var(--fg);background:var(--surface);transition:border-color .15s ease;}
  .btn:hover{border-color:var(--fg);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-offline">
  <div class="backdrop" aria-hidden="true">
    <div class="score-num">91,4</div>
    <div class="score-class">Monstro do Esgoto</div>
  </div>

  <div class="banner" data-od-id="offline-banner">
    <span class="banner-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 5.7-1M5 12.5a10 10 0 0 1 3-2M12 20h.01M16.8 14.8A10 10 0 0 0 19 12.5"/></svg></span>
    <div>
      <div class="banner-title">A internet morreu.</div>
      <p class="banner-sub">Seu arroto continua funcionando. O resultado será sincronizado depois.</p>
    </div>
  </div>

  <div class="foot">
    <a class="btn" href="resultado.html" data-od-id="btn-continuar">Continuar mesmo assim</a>
  </div>
</div>
</body>
</html>
