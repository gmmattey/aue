<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Seguidores</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a08;--surface:#171712;--fg:#f5f3ea;--muted:#93917f;--border:#2b2a22;--accent:#c6ff00;--font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;--font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;--font-mono:ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;--radius:24px;}
  *,*::before,*::after{box-sizing:border-box;} body{margin:0;background:var(--bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);} a{color:inherit;text-decoration:none;} button{font:inherit;cursor:pointer;background:none;border:0;color:inherit;} *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;} .appbar{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid var(--border);} .h1{font-family:var(--font-display);font-size:24px;text-transform:uppercase;letter-spacing:.06em;} .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);} .icon-btn svg{width:16px;height:16px;}
  .screen{flex:1;overflow-y:auto;padding:0 20px 24px;} .tabs{display:flex;gap:8px;padding:14px 0 8px;} .tab{min-height:36px;padding:0 14px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:12px;font-weight:600;} .tab.active,.tab:hover{color:var(--fg);border-color:var(--fg);background:var(--surface);} .row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--border);} .avatar{width:44px;height:44px;border-radius:999px;background:var(--border);display:grid;place-items:center;font-family:var(--font-display);font-size:16px;flex-shrink:0;} .row-info{flex:1;min-width:0;} .name{font-size:14px;font-weight:700;} .sub{font-size:12px;color:var(--muted);margin-top:3px;} .follow-btn{min-height:44px;padding:0 14px;border:1px solid var(--border);border-radius:999px;color:var(--fg);font-size:12px;font-weight:700;text-transform:uppercase;} .follow-btn.active{background:var(--accent);border-color:var(--accent);color:var(--bg);} .social{font-size:12px;color:var(--muted);margin-top:3px;} .social::before{content:'↗ ';color:var(--fg);} @media (min-width:560px){body{padding-block:32px;}.app-shell{min-height:844px;border:1px solid var(--border);border-radius:32px;}}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-seguidores">
  <header class="appbar" data-od-id="followers-appbar"><a class="icon-btn" href="perfil.html" aria-label="Voltar" data-od-id="followers-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></a><h1 class="h1">Seguidores</h1><span style="width:44px"></span></header>
  <main class="screen">
    <div class="tabs" data-od-id="followers-tabs"><button class="tab active" type="button">Seguidores · 128</button><button class="tab" type="button">Seguindo · 86</button></div>
    <div class="row" data-od-id="follower-carol"><div class="avatar">C</div><div class="row-info"><div class="name">Carol</div><div class="sub">Deus do Auê · Nível 6</div><div class="social">instagram.com/carol.arrota</div></div><button class="follow-btn active" type="button">Seguindo</button></div>
    <div class="row" data-od-id="follower-bruno"><div class="avatar">B</div><div class="row-info"><div class="name">Bruno</div><div class="sub">Mestre Arrotador · Nível 5</div><div class="social">tiktok.com/@bruno.arrota</div></div><button class="follow-btn" type="button">Seguir</button></div>
    <div class="row" data-od-id="follower-pedro"><div class="avatar">P</div><div class="row-info"><div class="name">Pedro</div><div class="sub">Tentativa Honesta · Nível 3</div><div class="social">youtube.com/@pedroauê</div></div><button class="follow-btn active" type="button">Seguindo</button></div>
  </main>
</div>
<script>document.querySelectorAll('.follow-btn').forEach((button)=>button.addEventListener('click',()=>{const active=button.classList.toggle('active');button.textContent=active?'Seguindo':'Seguir';})); document.querySelectorAll('.tab').forEach((button)=>button.addEventListener('click',()=>document.querySelectorAll('.tab').forEach((item)=>item.classList.toggle('active',item===button))));</script>
</body>
</html>
