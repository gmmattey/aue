<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Novo campeonato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --surface-2:#1f1f18; --accent-strong:#a8d900; --accent-on:#0a0a08; --gold:#f4c430; --gold-strong:#d9ac1c; --danger:#ff3d3f; --danger-strong:#e11a1c; --silver:#c7cad1; --bronze:#c98a4b;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
    --radius:18px; --radius-lg:24px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .appbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 4px;}
  .h1{font-family:var(--font-display);font-size:20px;text-transform:uppercase;letter-spacing:.06em;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}

  .screen{flex:1;overflow-y:auto;padding:20px 20px 24px;display:flex;flex-direction:column;gap:26px;}

  .field{display:flex;flex-direction:column;gap:8px;}
  .field label{font-size:13px;font-weight:600;color:var(--fg);}
  .input{width:100%;padding:14px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--fg);font:inherit;font-size:15px;}
  .input::placeholder{color:var(--muted);}
  .input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}

  .players{display:flex;flex-direction:column;gap:8px;}
  .player-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--border);}
  .player-row:first-child{border-top:none;}
  .avatar{width:36px;height:36px;border-radius:999px;background:var(--border);display:grid;place-items:center;font-family:var(--font-display);font-size:13px;flex-shrink:0;}
  .player-name{flex:1;font-size:14px;font-weight:600;}
  .remove-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--muted);flex-shrink:0;margin-right:-6px;}
  .remove-btn:hover{color:var(--fg);}
  .remove-btn svg{width:14px;height:14px;}
  .add-player{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:var(--radius);border:1px dashed var(--border);color:var(--muted);font-size:14px;font-weight:600;min-height:44px;}
  .add-player:hover{color:var(--fg);border-color:var(--fg);}
  .add-player svg{width:16px;height:16px;}

  .foot{margin-top:auto;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:17px 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent;width:100%;transition:background-color .15s ease,border-color .15s ease;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:var(--accent-strong);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-campeonato-criar">
  <header class="appbar" data-od-id="appbar">
    <a class="icon-btn" href="campeonatos-lista.html" aria-label="Cancelar" data-od-id="close-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
    <span class="h1">Novo campeonato</span>
    <span style="width:44px"></span>
  </header>

  <main class="screen">
    <div class="field" data-od-id="field-nome-campeonato">
      <label for="nome-campeonato">Nome do campeonato</label>
      <input class="input" id="nome-campeonato" type="text" placeholder="Ex.: Rachão da Firma" maxlength="40" data-od-id="input-nome-campeonato" />
    </div>

    <div class="field" data-od-id="field-jogadores">
      <label>Jogadores</label>
      <div class="players" data-od-id="players-list">
        <div class="player-row" data-od-id="player-voce">
          <div class="avatar">V</div>
          <span class="player-name">Você</span>
        </div>
        <div class="player-row" data-od-id="player-bruno">
          <div class="avatar">B</div>
          <span class="player-name">Bruno</span>
          <button class="remove-btn" aria-label="Remover Bruno" data-od-id="remove-bruno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="player-row" data-od-id="player-julia">
          <div class="avatar">J</div>
          <span class="player-name">Julia</span>
          <button class="remove-btn" aria-label="Remover Julia" data-od-id="remove-julia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
      </div>
      <button class="add-player" data-od-id="btn-adicionar-jogador">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Adicionar jogador
      </button>
    </div>

    <div class="foot">
      <a class="btn btn-primary" href="campeonato-lobby.html" data-od-id="btn-comecar-campeonato">Começar</a>
    </div>
  </main>
</div>
</body>
</html>
