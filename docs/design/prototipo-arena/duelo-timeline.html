<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auê! · Timeline do duelo</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#0a0a08;--surface:#171712;--fg:#f5f3ea;--muted:#93917f;--border:#2b2a22;--accent:#c6ff00;--d:'Anton',Impact,sans-serif;--b:'Inter',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--b)}.app{min-height:100dvh;max-width:440px;margin:auto;padding:24px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between}.mark{font:28px var(--d);letter-spacing:.08em}.close{color:var(--muted);font-size:24px}.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.1em;text-transform:uppercase}.h1{font:clamp(30px,8vw,40px) var(--d);text-transform:uppercase;letter-spacing:.05em}.sub{color:var(--muted);line-height:1.5}.event{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--border)}.dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none}.event strong{display:block}.event small{display:block;color:var(--muted);margin-top:4px}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;font-weight:700;text-transform:uppercase;text-decoration:none}.primary{background:var(--accent);color:var(--bg)}.ghost{color:var(--muted);border:1px solid var(--border)}*:focus-visible{outline:3px solid var(--accent);outline-offset:3px}</style></head><body><main class="app" data-od-id="screen-duelo-timeline"><header class="top"><span class="mark">Auê!</span><a class="close" href="home.html" aria-label="Fechar" data-od-id="close">×</a></header><section class="screen"><p class="eyebrow">Duelo remoto · timeline</p><h1 class="h1">A disputa está viva.</h1><p class="sub">Ouve, responde e acompanha quem já entrou pelo link.</p><div class="event"><span class="dot"></span><div><strong>Luiz · 78 Auê Score</strong><small>Arroto enviado há 4 min · ouvir arroto anterior</small></div></div><div class="event"><span class="dot"></span><div><strong>Você · sua vez</strong><small>Nenhum arroto enviado ainda</small></div></div><a class="btn primary" href="permissao.html" data-od-id="btn-responder-duelo">Responder com arroto</a><a class="btn ghost" href="duelo-resultado.html" data-od-id="btn-ver-resultado">Ver placar</a></section></main></body></html>
