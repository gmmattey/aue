<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auê! · Banner da disputa</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#0a0a08;--surface:#171712;--fg:#f5f3ea;--muted:#93917f;--border:#2b2a22;--accent:#c6ff00;--d:'Anton',Impact,sans-serif;--b:'Inter',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--b)}.app{min-height:100dvh;max-width:440px;margin:auto;padding:24px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between}.mark{font:28px var(--d);letter-spacing:.08em}.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.1em;text-transform:uppercase}.h1{font:clamp(30px,8vw,40px) var(--d);text-transform:uppercase;letter-spacing:.05em}.banner{padding:26px;border:1px solid var(--accent);border-radius:24px;background:var(--surface)}.banner small{color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.winner{font:48px var(--d);text-transform:uppercase;margin-top:8px}.score{color:var(--accent);font:68px var(--d);line-height:1}.sub{color:var(--muted);line-height:1.5}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;font-weight:700;text-transform:uppercase;text-decoration:none}.primary{background:var(--accent);color:var(--bg)}.ghost{color:var(--muted);border:1px solid var(--border)}*:focus-visible{outline:3px solid var(--accent);outline-offset:3px}</style></head><body><main class="app" data-od-id="screen-disputa-banner"><header class="top"><span class="mark">Auê!</span></header><section class="screen"><p class="eyebrow">Disputa local · compartilhável</p><h1 class="h1">A prova da noite.</h1><div class="banner" data-od-id="share-banner"><small>Campeão da mesa do escritório</small><div class="winner">Luiz</div><div class="score">247</div><p>Auê Score acumulado · 3 rounds</p></div><p class="sub">Um banner para mandar no grupo e provocar a revanche.</p><a class="btn primary" href="compartilhar.html" data-od-id="btn-compartilhar-banner">Compartilhar banner</a><a class="btn ghost" href="campeonato.html" data-od-id="btn-voltar-podio">Voltar ao pódio</a></section></main></body></html>
