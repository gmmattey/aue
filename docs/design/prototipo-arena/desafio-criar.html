<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auê! · Criar desafio</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#0a0a08;--surface:#171712;--fg:#f5f3ea;--muted:#93917f;--border:#2b2a22;--accent:#c6ff00;--d:'Anton',Impact,sans-serif;--b:'Inter',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--b)}.app{min-height:100dvh;max-width:440px;margin:auto;padding:24px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.mark{font:28px var(--d);letter-spacing:.08em}.close{color:var(--muted);font-size:24px}.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.1em;text-transform:uppercase}.h1{font:clamp(30px,8vw,40px) var(--d);text-transform:uppercase;letter-spacing:.05em;max-width:10ch}.sub{color:var(--muted);line-height:1.5}.field{display:grid;gap:8px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.input{padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--fg);font:inherit}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;font-weight:700;text-transform:uppercase;text-decoration:none}.primary{background:var(--accent);color:var(--bg)}.ghost{color:var(--muted);border:1px solid var(--border)}*:focus-visible{outline:3px solid var(--accent);outline-offset:3px}</style></head><body><main class="app" data-od-id="screen-criar-desafio"><header class="top"><span class="mark">Auê!</span><a class="close" href="home.html" aria-label="Fechar" data-od-id="close">×</a></header><section class="screen"><p class="eyebrow">Duelo remoto · 01</p><h1 class="h1">Chama alguém pra passar vergonha.</h1><p class="sub">Crie um duelo privado. A outra pessoa entra pelo link, arrota e a disputa começa.</p><label class="field"><span class="label">Nome do desafio</span><input class="input" value="Quem arrota melhor?" data-od-id="challenge-name"></label><a class="btn primary" href="convite.html" data-od-id="btn-criar-desafio">Criar desafio</a><a class="btn ghost" href="home.html" data-od-id="btn-cancelar">Agora não</a></section></main></body></html>
