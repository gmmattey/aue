<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auê! · Criar disputa</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#0a0a08;--surface:#171712;--fg:#f5f3ea;--muted:#93917f;--border:#2b2a22;--accent:#c6ff00;--d:'Anton',Impact,sans-serif;--b:'Inter',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--b)}.app{min-height:100dvh;max-width:440px;margin:auto;padding:24px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between}.mark{font:28px var(--d);letter-spacing:.08em}.close{color:var(--muted);font-size:24px}.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:17px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.1em;text-transform:uppercase}.h1{font:clamp(30px,8vw,40px) var(--d);text-transform:uppercase;letter-spacing:.05em;max-width:11ch}.sub{color:var(--muted);line-height:1.5}.field{display:grid;gap:7px}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.input{width:100%;padding:15px;border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--fg);font:inherit}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.option{padding:14px 8px;border:1px solid var(--border);border-radius:16px;background:var(--surface);text-align:center}.option.active{border-color:var(--accent);color:var(--accent)}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;font-weight:700;text-transform:uppercase;text-decoration:none}.primary{background:var(--accent);color:var(--bg)}*:focus-visible{outline:3px solid var(--accent);outline-offset:3px}</style></head><body><main class="app" data-od-id="screen-disputa-config"><header class="top"><span class="mark">Auê!</span><a class="close" href="home.html" aria-label="Fechar" data-od-id="close">×</a></header><section class="screen"><p class="eyebrow">Disputa local · 01</p><h1 class="h1">Monta a mesa.</h1><p class="sub">De 2 a 5 participantes. De 1 a 3 rounds. O contexto ajuda a história.</p><label class="field"><span class="label">Participantes</span><input class="input" value="Luiz, Bruno, Julia" data-od-id="participants"></label><label class="field"><span class="label">Rounds</span><div class="options"><span class="option active">1</span><span class="option">2</span><span class="option">3</span></div></label><label class="field"><span class="label">Contexto / local</span><input class="input" value="Mesa do escritório" data-od-id="context"></label><a class="btn primary" href="campeonato-lobby.html" data-od-id="btn-criar-disputa">Começar disputa</a></section></main></body></html>
