<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Comentários</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --surface-2:#1f1f18; --accent-strong:#a8d900; --accent-on:#0a0a08; --gold:#f4c430; --gold-strong:#d9ac1c; --danger:#ff3d3f; --danger-strong:#e11a1c; --silver:#c7cad1; --bronze:#c98a4b;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
    --radius:18px; --radius-lg:24px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);position:relative;overflow-x:hidden;}
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  /* feed de fundo, apagado — dá contexto de que o sheet abriu por cima */
  .backdrop{position:absolute;inset:0;padding:20px;filter:blur(1px) brightness(.5);pointer-events:none;user-select:none;}
  .backdrop .post{padding:18px 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px;}
  .backdrop .post:first-child{border-top:none;}
  .backdrop .post-head{display:flex;align-items:center;gap:12px;}
  .backdrop .avatar{width:40px;height:40px;border-radius:999px;background:var(--border);display:grid;place-items:center;font-family:var(--font-display);font-size:15px;}
  .backdrop .post-name{font-weight:600;font-size:14px;}
  .backdrop .post-time{font-size:12px;color:var(--muted);}
  .backdrop .post-score{font-family:var(--font-mono);font-size:30px;font-weight:700;color:var(--accent);}
  .backdrop .post-class{font-family:var(--font-display);font-size:14px;text-transform:uppercase;margin-left:10px;}
  .scrim{position:absolute;inset:0;background:color-mix(in oklch, var(--bg) 70%, transparent);animation:scrim-in .2s ease both;}
  @keyframes scrim-in{from{opacity:0;}to{opacity:1;}}

  /* sheet de comentários */
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--border);border-bottom:none;border-radius:24px 24px 0 0;box-shadow:0 -24px 60px -20px rgba(0,0,0,.6);animation:sheet-in .28s cubic-bezier(.2,0,0,1) both;}
  @keyframes sheet-in{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .scrim,.sheet{animation:none;} }
  .sheet-handle{width:40px;height:4px;border-radius:999px;background:var(--border);margin:10px auto 4px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 14px;border-bottom:1px solid var(--border);}
  .sheet-title{font-family:var(--font-display);font-size:17px;text-transform:uppercase;letter-spacing:.01em;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}

  .context-row{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);}
  .avatar{width:34px;height:34px;border-radius:999px;background:var(--border);display:grid;place-items:center;font-family:var(--font-display);font-size:13px;flex-shrink:0;}
  .context-score{font-family:var(--font-mono);font-weight:700;color:var(--accent);}
  .context-class{font-size:12px;color:var(--muted);}

  .comment-list{flex:1;overflow-y:auto;padding:6px 18px 16px;display:flex;flex-direction:column;gap:16px;}
  .comment{display:flex;gap:12px;}
  .comment-body{flex:1;min-width:0;}
  .comment-name{font-size:13px;font-weight:600;}
  .comment-time{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400;}
  .comment-text{font-size:14px;line-height:1.5;margin-top:3px;}

  .composer{display:flex;align-items:center;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg);}
  .composer input{flex:1;height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--fg);font:inherit;font-size:14px;}
  .composer input::placeholder{color:var(--muted);}
  .composer input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  .send-btn{width:44px;height:44px;border-radius:999px;background:var(--accent);color:var(--bg);display:grid;place-items:center;flex-shrink:0;}
  .send-btn svg{width:18px;height:18px;}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-comunidade-comentarios">
  <div class="backdrop" aria-hidden="true">
    <div class="post">
      <div class="post-head">
        <div class="avatar">C</div>
        <div><div class="post-name">Carol</div><div class="post-time">há 8 min</div></div>
      </div>
      <div><span class="post-score">98,1</span><span class="post-class">Deus do Auê</span></div>
    </div>
  </div>
  <div class="scrim"></div>

  <div class="sheet" data-od-id="comments-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span class="sheet-title">Comentários</span>
      <a class="icon-btn" href="comunidade.html" aria-label="Fechar" data-od-id="close-sheet-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </a>
    </div>

    <div class="context-row" data-od-id="comments-context">
      <div class="avatar">C</div>
      <div><span class="context-score">98,1</span> <span class="context-class">Deus do Auê · Carol</span></div>
    </div>

    <div class="comment-list" data-od-id="comment-list">
      <div class="comment" data-od-id="comment-1">
        <div class="avatar">B</div>
        <div class="comment-body">
          <span class="comment-name">Bruno<span class="comment-time">há 5 min</span></span>
          <p class="comment-text">98 é humanamente impossível, tira o filtro aí.</p>
        </div>
      </div>
      <div class="comment" data-od-id="comment-2">
        <div class="avatar">P</div>
        <div class="comment-body">
          <span class="comment-name">Pedro<span class="comment-time">há 3 min</span></span>
          <p class="comment-text">Chamando a perícia técnica nesse arroto.</p>
        </div>
      </div>
      <div class="comment" data-od-id="comment-3">
        <div class="avatar">J</div>
        <div class="comment-body">
          <span class="comment-name">Julia<span class="comment-time">há 1 min</span></span>
          <p class="comment-text">Carol não vim aqui pra ficar bravo mas isso é injusto</p>
        </div>
      </div>
    </div>

    <form class="composer" data-od-id="comment-composer">
      <input type="text" placeholder="Solta o comentário..." aria-label="Escrever comentário" data-od-id="comment-input" />
      <button type="submit" class="send-btn" aria-label="Comentar" data-od-id="send-comment-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg>
      </button>
    </form>
  </div>
</div>
</body>
</html>
