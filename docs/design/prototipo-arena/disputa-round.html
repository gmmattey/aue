<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auê! · Nota do round</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#0a0a08;--surface:#171712;--fg:#f5f3ea;--muted:#93917f;--border:#2b2a22;--accent:#c6ff00;--d:'Anton',Impact,sans-serif;--b:'Inter',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--b)}.app{min-height:100dvh;max-width:440px;margin:auto;padding:24px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between}.mark{font:28px var(--d);letter-spacing:.08em}.screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;text-align:center}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.1em;text-transform:uppercase}.h1{font:clamp(30px,8vw,40px) var(--d);text-transform:uppercase;letter-spacing:.05em}.score{font:96px var(--d);line-height:.9;color:var(--accent)}.sub{color:var(--muted);line-height:1.5}.rows{text-align:left}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border)}.row span:last-child{font-weight:700}.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;font-weight:700;text-transform:uppercase;text-decoration:none}.primary{background:var(--accent);color:var(--bg)}.ghost{color:var(--muted);border:1px solid var(--border)}*:focus-visible{outline:3px solid var(--accent);outline-offset:3px}</style></head><body><main class="app" data-od-id="screen-disputa-round"><header class="top"><span class="mark">Auê!</span></header><section class="screen"><p class="eyebrow">Disputa local · round 1</p><h1 class="h1">Bruno mandou.</h1><div class="score" data-od-id="round-score">84</div><p class="sub">A nota entrou no ranking. Próximo participante, prepara.</p><div class="rows"><div class="row"><span>Potência</span><span>88</span></div><div class="row"><span>Comprimento</span><span>76</span></div></div><a class="btn primary" href="ranking.html" data-od-id="btn-ranking-round">Ver ranking do round</a><a class="btn ghost" href="campeonato-lobby.html" data-od-id="btn-proximo-turno">Próximo turno</a></section></main></body></html>
