<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Você venceu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --surface-2:#1f1f18; --accent-strong:#a8d900; --accent-on:#0a0a08; --gold:#f4c430; --gold-strong:#d9ac1c; --danger:#ff3d3f; --danger-strong:#e11a1c; --silver:#c7cad1; --bronze:#c98a4b;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
    --radius-lg:24px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;text-wrap:balance;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .appbar{display:flex;align-items:center;padding:20px;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}

  .screen{flex:1;display:flex;flex-direction:column;padding:8px 20px 24px;gap:22px;}

  .verdict{text-align:center;display:flex;flex-direction:column;gap:6px;}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .h1{font-family:var(--font-display);font-size:clamp(28px,7vw,34px);text-transform:uppercase;letter-spacing:.06em;}

  .vs-wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;animation:fade-up .35s cubic-bezier(.2,0,0,1) .15s both;}
  .vs-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
  .vs-card.winner{border-color:var(--gold);animation:winner-pop .4s cubic-bezier(.2,0,0,1) .35s both;}
  @keyframes fade-up{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes winner-pop{from{transform:scale(1);}40%{transform:scale(1.04);}to{transform:scale(1);}}
  @media (prefers-reduced-motion: reduce){ .vs-wrap,.vs-card.winner{animation:none;} }
  .avatar{width:52px;height:52px;border-radius:999px;background:var(--border);display:grid;place-items:center;font-family:var(--font-display);font-size:19px;}
  .vs-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;}
  .vs-name svg{width:14px;height:14px;color:var(--gold);}
  .vs-score{font-family:var(--font-display);font-size:34px;line-height:1;}
  .vs-card.winner .vs-score{color:var(--gold);}
  .vs-card:not(.winner) .vs-score{color:var(--fg);}
  .vs-class{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .vs-label{font-family:var(--font-display);font-size:16px;color:var(--muted);text-align:center;}

  .xp-pill{display:inline-flex;align-self:center;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;}

  .roast{font-family:var(--font-display);font-size:18px;text-align:center;color:var(--fg);max-width:26ch;margin:0 auto;line-height:1.3;}

  .actions{display:flex;flex-direction:column;gap:12px;margin-top:auto;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:17px 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent;width:100%;transition:background-color .15s ease,border-color .15s ease;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-secondary{background:transparent;color:var(--fg);border-color:var(--border);}
  .btn-secondary:hover{border-color:var(--fg);}

  .ad-slot{padding:16px;border:1px dashed var(--border);border-radius:var(--radius-lg);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:80px;text-align:center;}
  .ad-slot-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .ad-slot-note{font-size:11.5px;color:var(--muted);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-duelo-resultado">
  <header class="appbar" data-od-id="appbar">
    <a class="icon-btn" href="home.html" aria-label="Fechar" data-od-id="close-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
  </header>

  <main class="screen">
    <section class="verdict" data-od-id="duel-verdict">
      <p class="eyebrow">Duelo encerrado</p>
      <h1 class="h1">Você venceu.</h1>
      <span class="xp-pill" data-od-id="xp-pill">+60 XP · você segue em #12</span>
    </section>

    <section class="vs-wrap" data-od-id="duel-comparison">
      <div class="vs-card winner" data-od-id="vs-you">
        <div class="avatar">V</div>
        <span class="vs-name"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8Z"/></svg>Você</span>
        <span class="vs-score">62,0</span>
        <span class="vs-class">Arroto Respeitável</span>
      </div>
      <span class="vs-label">VS</span>
      <div class="vs-card" data-od-id="vs-luiz">
        <div class="avatar">L</div>
        <span class="vs-name">Luiz</span>
        <span class="vs-score">61,7</span>
        <span class="vs-class">Arroto Respeitável</span>
      </div>
    </section>

    <p class="roast" data-od-id="roast-line">Foi por pouco. A dignidade dele também foi embora.</p>

    <div class="actions">
      <a class="btn btn-primary" href="permissao.html" data-od-id="btn-pedir-revanche">Pedir revanche</a>
      <a class="btn btn-secondary" href="compartilhar.html" data-od-id="btn-compartilhar">Compartilhar</a>
    </div>

    <div class="ad-slot" data-od-id="ad-slot-duelo-resultado" role="complementary" aria-label="Anúncio">
      <span class="ad-slot-label">Anúncio</span>
      <span class="ad-slot-note">Espaço reservado — banner 320×100</span>
    </div>
  </main>
</div>
</body>
</html>
