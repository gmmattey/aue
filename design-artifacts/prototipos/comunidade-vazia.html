<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Trabalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --surface-2:#1f1f18; --accent-strong:#a8d900; --accent-on:#0a0a08; --gold:#f4c430; --gold-strong:#d9ac1c; --danger:#ff3d3f; --danger-strong:#e11a1c; --silver:#c7cad1; --bronze:#c98a4b;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .appbar{display:flex;align-items:center;justify-content:space-between;padding:20px;gap:12px;}
  .appbar-id{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .h1{font-family:var(--font-display);font-size:20px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .appbar-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);flex-shrink:0;transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}

  .screen{flex:1;display:flex;flex-direction:column;padding:0 20px 24px;}
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-bottom:40px;}
  .empty-badge{width:80px;height:80px;border-radius:999px;background:var(--surface);border:1px dashed var(--border);display:grid;place-items:center;color:var(--muted);}
  .empty-badge svg{width:30px;height:30px;}
  .empty-title{font-family:var(--font-display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;max-width:18ch;}
  .empty-sub{color:var(--muted);font-size:14px;max-width:28ch;line-height:1.5;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 24px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent;background:var(--accent);color:var(--bg);margin-top:6px;transition:background-color .15s ease;}
  .btn:hover{background:var(--accent-strong);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-comunidade-vazia">
  <header class="appbar" data-od-id="appbar">
    <a class="icon-btn" href="comunidades.html" aria-label="Voltar" data-od-id="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="appbar-id" data-od-id="community-identity">
      <h1 class="h1">Trabalho</h1>
      <span class="appbar-sub">31 membros</span>
    </div>
    <a class="icon-btn" href="comunidade-criar.html" data-gate="criar-comunidade" data-gate-destino="comunidade-criar.html" aria-label="Criar comunidade" data-od-id="create-community-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </header>

  <main class="screen">
    <div class="empty" data-od-id="community-empty-state">
      <div class="empty-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>
      <p class="empty-title">Essa comunidade tá quieta demais.</p>
      <p class="empty-sub">Ninguém postou um resultado por aqui ainda. Quebra o gelo.</p>
      <a class="btn" href="permissao.html" data-od-id="btn-arrotar-primeiro">Arrotar primeiro</a>
    </div>
  </main>
</div>
<script>
/* FRONTEIRA DE PUBLICAÇÃO — regra única (DECISOES.md D3 / lacuna L1).
   Marque o controle com data-gate="<acao>" e, se o destino final não for o href, data-gate-destino.
   Sem conta, o controle desvia para idade.html; com conta, segue direto. */
(function(){
  var temConta=false; try{temConta=sessionStorage.getItem('aue-conta')==='1';}catch(e){}
  document.querySelectorAll('[data-gate]').forEach(function(el){
    var destino=el.getAttribute('data-gate-destino')||el.getAttribute('href')||'home.html';
    var url=temConta?destino:'idade.html?acao='+encodeURIComponent(el.getAttribute('data-gate'))+'&destino='+encodeURIComponent(destino);
    if(el.tagName==='A'){el.setAttribute('href',url);}
    else{el.addEventListener('click',function(ev){if(!temConta){ev.preventDefault();location.href=url;}},true);}
  });
})();
</script>
</body>
</html>
