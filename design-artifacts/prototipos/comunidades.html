<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Comunidades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --surface-2:#1f1f18; --accent-strong:#a8d900; --accent-on:#0a0a08; --gold:#f4c430; --gold-strong:#d9ac1c; --danger:#ff3d3f; --danger-strong:#e11a1c; --silver:#c7cad1; --bronze:#c98a4b;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
    --radius-lg:24px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .appbar{display:flex;align-items:center;justify-content:space-between;padding:20px;gap:12px;}
  .h1{font-family:var(--font-display);font-size:24px;text-transform:uppercase;letter-spacing:.06em;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}

  .screen{flex:1;overflow-y:auto;padding:0 20px 24px;}
  .section-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 4px 8px;}

  .row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-top:1px solid var(--border);}
  .row:first-child{border-top:none;}
  .avatar{width:44px;height:44px;border-radius:999px;background:var(--border);display:grid;place-items:center;font-family:var(--font-display);font-size:16px;flex-shrink:0;}
  .row-info{flex:1;min-width:0;}
  .row-name{font-weight:600;font-size:14px;}
  .row-sub{font-size:12px;color:var(--muted);}
  .row-btn{flex-shrink:0;display:flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;border:1px solid var(--border);color:var(--fg);transition:border-color .15s ease;}
  .row-btn:hover{border-color:var(--fg);}

  .search{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);margin-bottom:4px;}
  .search svg{width:18px;height:18px;color:var(--muted);flex-shrink:0;}
  .search input{width:100%;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;}
  .search input::placeholder{color:var(--muted);}
  .topics{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;}
  .topics::-webkit-scrollbar{display:none;}
  .topic{flex-shrink:0;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);color:var(--muted);font-size:12px;font-weight:600;display:inline-flex;align-items:center;cursor:pointer;}
  .topic.active,.topic:hover{border-color:var(--fg);color:var(--fg);}
  .topic.active{background:var(--surface);}
  .row[data-hidden="true"]{display:none;}

  .ad-slot{margin:16px 0;padding:16px;border:1px dashed var(--border);border-radius:var(--radius-lg);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:100px;text-align:center;}
  .ad-slot-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .ad-slot-note{font-size:11.5px;color:var(--muted);}

  .foot-cta{margin-top:20px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:17px 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent;width:100%;transition:background-color .15s ease,border-color .15s ease;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:var(--accent-strong);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-comunidades">
  <header class="appbar" data-od-id="appbar">
    <a class="icon-btn" href="home.html" aria-label="Voltar" data-od-id="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <h1 class="h1">Comunidades</h1>
    <a class="icon-btn" href="feed.html" aria-label="Abrir feed" data-od-id="open-feed-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
    </a>
  </header>

  <main class="screen">
    <label class="search" data-od-id="community-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="community-search-input" type="search" placeholder="Buscar comunidade ou assunto" aria-label="Buscar comunidade ou assunto" />
    </label>
    <div class="topics" aria-label="Tópicos" data-od-id="community-topics">
      <button class="topic active" type="button" data-topic="todos">Todos</button>
      <button class="topic" type="button" data-topic="campeonato">Campeonato</button>
      <button class="topic" type="button" data-topic="bar">Bar e mesa</button>
      <button class="topic" type="button" data-topic="escritorio">Escritório</button>
    </div>
    <p class="section-label">Suas comunidades</p>
    <div class="row community-item" data-search="galera do escritório escritório campeonato" data-topic="escritorio campeonato" data-od-id="comunidade-row-escritorio">
      <div class="avatar">G</div>
      <div class="row-info"><div class="row-name">Galera do Escritório</div><div class="row-sub">148 membros · Pública</div></div>
      <a class="row-btn" href="comunidade.html" data-od-id="btn-abrir-escritorio">Abrir</a>
    </div>

    <div class="ad-slot" data-od-id="ad-slot-comunidades" role="complementary" aria-label="Anúncio">
      <span class="ad-slot-label">Anúncio</span>
      <span class="ad-slot-note">Espaço reservado — AdSense in-feed 320×100</span>
    </div>

    <p class="section-label">Descobrir</p>
    <div class="row community-item" data-search="arrotadores noturnos bar e mesa" data-topic="bar" data-od-id="comunidade-row-noturnos">
      <div class="avatar">A</div>
      <div class="row-info"><div class="row-name">Arrotadores Noturnos</div><div class="row-sub">62 membros · Pública</div></div>
      <a class="row-btn" href="comunidade.html" data-gate="entrar-comunidade" data-gate-destino="comunidade.html" data-od-id="btn-entrar-noturnos">Entrar</a>
    </div>
    <div class="row community-item" data-search="trabalho escritório" data-topic="escritorio" data-od-id="comunidade-row-firma">
      <div class="avatar">T</div>
      <div class="row-info"><div class="row-name">Trabalho</div><div class="row-sub">31 membros · Por convite</div></div>
      <a class="row-btn" href="comunidade.html" data-gate="entrar-comunidade" data-gate-destino="comunidade.html" data-od-id="btn-entrar-firma">Entrar</a>
    </div>

    <div class="foot-cta">
      <a class="btn btn-primary" href="comunidade-criar.html" data-gate="criar-comunidade" data-gate-destino="comunidade-criar.html" data-od-id="btn-criar-comunidade">Criar comunidade</a>
    </div>
  </main>
</div>
<script>
  const searchInput = document.querySelector('#community-search-input');
  const topicButtons = [...document.querySelectorAll('.topic')];
  const communityItems = [...document.querySelectorAll('.community-item')];
  let selectedTopic = 'todos';
  function filterCommunities(){
    const query = searchInput.value.trim().toLowerCase();
    communityItems.forEach((item) => {
      const matchesText = !query || item.dataset.search.includes(query);
      const matchesTopic = selectedTopic === 'todos' || item.dataset.topic.includes(selectedTopic);
      item.dataset.hidden = String(!(matchesText && matchesTopic));
    });
  }
  searchInput.addEventListener('input', filterCommunities);
  topicButtons.forEach((button) => button.addEventListener('click', () => {
    selectedTopic = button.dataset.topic;
    topicButtons.forEach((item) => item.classList.toggle('active', item === button));
    filterCommunities();
  }));
</script>
<script>
/* FRONTEIRA DE PUBLICAÇÃO — regra única (DECISOES.md D3 / lacuna L1).
   Marque o controle com data-gate="<acao>" e, se o destino final não for o href, data-gate-destino.
   Sem conta, o controle desvia para idade.html; com conta, segue direto. */
(function(){
  var temConta=false; try{temConta=sessionStorage.getItem('aue-conta')==='1';}catch(e){}
  document.querySelectorAll('[data-gate]').forEach(function(el){
    var destino=el.getAttribute('data-gate-destino')||el.getAttribute('href')||'home.html';
    var url=temConta?destino:'idade.html?acao='+encodeURIComponent(el.getAttribute('data-gate'))+'&destino='+encodeURIComponent(destino);
    if(el.tagName==='A'){el.setAttribute('href',url);}
    else{el.addEventListener('click',function(ev){if(!temConta){ev.preventDefault();location.href=url;}},true);}
  });
})();
</script>
</body>
</html>
