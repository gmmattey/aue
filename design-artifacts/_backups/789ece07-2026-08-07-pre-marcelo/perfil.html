<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --surface-2:#1f1f18; --accent-strong:#a8d900; --accent-on:#0a0a08; --gold:#f4c430; --gold-strong:#d9ac1c; --danger:#ff3d3f; --danger-strong:#e11a1c; --silver:#c7cad1; --bronze:#c98a4b;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
    --radius:18px; --radius-lg:24px;
    --gap-xs:8px; --gap-sm:12px; --gap-md:20px; --gap-lg:32px; --gap-xl:48px;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .appbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 4px;}
  .h1{font-family:var(--font-display);font-size:24px;text-transform:uppercase;letter-spacing:.01em;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}

  .screen{flex:1;overflow-y:auto;padding:12px 20px 24px;display:flex;flex-direction:column;gap:24px;}

  .id-block{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;}
  .avatar-lg{width:88px;height:88px;border-radius:999px;background:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-size:34px;color:var(--bg);}
  .apelido{font-family:var(--font-display);font-size:24px;text-transform:uppercase;margin-top:8px;}
  .title{font-size:13px;color:var(--muted);}

  .xp-block{display:flex;flex-direction:column;gap:8px;}
  .xp-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--font-mono);}
  .xp-head b{color:var(--fg);}
  .track{height:8px;border-radius:999px;background:var(--border);overflow:hidden;}
  .fill{height:100%;border-radius:999px;background:var(--accent);}

  .statbar{display:flex;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .statbar .stat{flex:1;padding:16px 4px;text-align:center;}
  .statbar .stat + .stat{border-left:1px solid var(--border);}
  .stat-num{font-family:var(--font-mono);font-size:20px;font-weight:600;}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}

  .btn-row{display:flex;gap:10px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.02em;text-transform:uppercase;border:1px solid var(--border);width:100%;color:var(--fg);transition:border-color .15s ease;}
  .btn:hover{border-color:var(--fg);}

  .setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);}
  .setting-row.link{transition:border-color .15s ease;}
  .setting-row.link:hover{border-color:var(--fg);}
  .setting-left{display:flex;align-items:center;gap:12px;}
  .setting-left svg{width:20px;height:20px;color:var(--accent);}
  .setting-title{font-size:14px;font-weight:600;}
  .setting-sub{font-size:12px;color:var(--muted);}

  .bottomnav{display:flex;align-items:flex-end;justify-content:space-around;padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:color-mix(in oklch, var(--bg) 92%, transparent);backdrop-filter:blur(14px);border-top:1px solid var(--border);}
  .navitem{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em;padding:4px 10px;transition:color .15s ease;}
  .navitem:hover{color:var(--fg);}
  .navitem svg{width:22px;height:22px;}
  .navitem.active{color:var(--fg);}
  .navitem.primary .navcircle{width:52px;height:52px;border-radius:999px;background:var(--accent);display:grid;place-items:center;margin-top:-30px;border:5px solid var(--bg);}
  .navitem.primary .navcircle svg{width:24px;height:24px;color:var(--bg);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-perfil">
  <header class="appbar" data-od-id="appbar">
    <h1 class="h1">Perfil</h1>
    <div style="display:flex;gap:8px;">
      <a class="icon-btn" href="perfil-editar.html" aria-label="Editar perfil" data-od-id="edit-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </a>
      <a class="icon-btn" href="configuracoes.html" aria-label="Configurações" data-od-id="settings-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.04Z"/></svg>
      </a>
    </div>
  </header>

  <main class="screen">
    <section class="id-block" data-od-id="profile-identity">
      <div class="avatar-lg">V</div>
      <div class="apelido" data-od-id="apelido">Você</div>
      <div class="title" data-od-id="profile-title">Trovão Humano · Nível 4</div>
    </section>

    <section class="xp-block" data-od-id="xp-progress">
      <div class="xp-head"><span>Nível 4</span><b>640 / 900 XP</b></div>
      <div class="track"><div class="fill" style="width:71%"></div></div>
    </section>

    <div class="statbar" data-od-id="profile-stats">
      <div class="stat"><div class="stat-num">87,4</div><div class="stat-label">Melhor Auê</div></div>
      <div class="stat"><div class="stat-num">14</div><div class="stat-label">Vitórias</div></div>
      <div class="stat"><div class="stat-num">9</div><div class="stat-label">Conquistas</div></div>
    </div>

    <div class="btn-row" data-od-id="profile-links">
      <a class="btn" href="conquistas.html" data-od-id="btn-conquistas">Conquistas</a>
      <a class="btn" href="historico.html" data-od-id="btn-historico">Histórico</a>
    </div>

    <a class="setting-row link" href="seguidores.html" data-od-id="seguidores-link">
      <div class="setting-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <div><div class="setting-title">Seguidores</div><div class="setting-sub">128 seguidores · seguindo 86</div></div>
      </div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;color:var(--muted);flex-shrink:0;"><path d="m9 6 6 6-6 6"/></svg>
    </a>

    <a class="setting-row link" href="assinatura.html" data-od-id="assinatura-link">
      <div class="setting-left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3l-6.1 3.3 1.4-6.8L2.2 9l6.9-.8L12 2Z"/></svg>
        <div>
          <div class="setting-title">Auê! sem limite</div>
          <div class="setting-sub">Sem anúncios, arrotos ilimitados e favoritos</div>
        </div>
      </div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;color:var(--muted);flex-shrink:0;"><path d="m9 6 6 6-6 6"/></svg>
    </a>
  </main>

  <nav class="bottomnav" data-od-id="bottomnav">
    <a class="navitem" href="home.html" data-od-id="nav-inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      Início
    </a>
    <a class="navitem primary" href="permissao.html" data-od-id="nav-arrotar">
      <span class="navcircle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/></svg>
      </span>
      <span style="color:var(--muted)">Arrotar</span>
    </a>
    <a class="navitem" href="ranking.html" data-od-id="nav-ranking">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M6 4h12v3a6 6 0 0 1-12 0V4Z"/><path d="M6 5H3v2a3 3 0 0 0 3 3M18 5h3v2a3 3 0 0 1-3 3"/></svg>
      Ranking
    </a>
  </nav>
</div>
</body>
</html>
