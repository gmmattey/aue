<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · De onde veio?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --surface-2:#1f1f18; --accent-strong:#a8d900; --accent-on:#0a0a08; --gold:#f4c430; --gold-strong:#d9ac1c; --danger:#ff3d3f; --danger-strong:#e11a1c; --silver:#c7cad1; --bronze:#c98a4b;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);position:relative;overflow-x:hidden;}
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  /* fundo: fim da gravação, apagado — mostra que o sheet abriu por cima */
  .backdrop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;filter:blur(1px) brightness(.45);pointer-events:none;user-select:none;}
  .backdrop-h1{font-family:var(--font-display);font-size:44px;text-transform:uppercase;letter-spacing:.06em;}
  .backdrop-bolha{width:150px;height:150px;border-radius:47% 53% 61% 39% / 55% 45% 55% 45%;background:var(--accent);}
  .scrim{position:absolute;inset:0;background:color-mix(in oklch, var(--bg) 70%, transparent);animation:scrim-in .2s ease both;}
  @keyframes scrim-in{from{opacity:0;}to{opacity:1;}}

  .sheet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--border);border-bottom:none;border-radius:24px 24px 0 0;box-shadow:0 -24px 60px -20px rgba(0,0,0,.6);padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:sheet-in .28s cubic-bezier(.2,0,0,1) both;}
  @keyframes sheet-in{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .scrim,.sheet{animation:none;} }
  .sheet-handle{width:40px;height:4px;border-radius:999px;background:var(--border);margin:10px auto 4px;}
  .sheet-head{padding:8px 20px 4px;text-align:center;}
  .sheet-title{font-family:var(--font-display);font-size:22px;text-transform:uppercase;letter-spacing:.06em;}
  .sheet-sub{font-size:13px;color:var(--muted);margin-top:4px;}

  .origin-list{padding:8px 12px 4px;}
  .origin-row{display:flex;align-items:center;gap:14px;padding:14px 8px;border-top:1px solid var(--border);min-height:44px;border-radius:14px;transition:background-color .15s ease;}
  .origin-row:first-child{border-top:none;}
  .origin-row:hover{background:var(--surface);}
  .origin-emoji{font-size:22px;width:30px;text-align:center;flex-shrink:0;}
  .origin-label{flex:1;font-size:15px;font-weight:600;}
  .origin-sub{font-size:12px;color:var(--muted);margin-top:2px;font-weight:400;}
  .origin-chevron{width:18px;height:18px;color:var(--muted);flex-shrink:0;}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-origem">
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop-h1">Manda.</div>
    <div class="backdrop-bolha"></div>
  </div>
  <div class="scrim"></div>

  <div class="sheet" data-od-id="origin-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <p class="sheet-title">E isso veio de onde?</p>
      <p class="sheet-sub">Ajuda a julgar direito.</p>
    </div>

    <div class="origin-list" data-od-id="origin-options">
      <a class="origin-row" href="julgando.html" data-od-id="origin-ar">
        <span class="origin-emoji" aria-hidden="true">💨</span>
        <span class="origin-label">Forçado com ar</span>
      </a>
      <a class="origin-row" href="origem-bebida.html" data-od-id="origin-bebida">
        <span class="origin-emoji" aria-hidden="true">🍺</span>
        <div class="origin-label">Pós bebida<div class="origin-sub">Escolher qual</div></div>
        <svg class="origin-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </a>
      <a class="origin-row" href="origem-comida.html" data-od-id="origin-comida">
        <span class="origin-emoji" aria-hidden="true">🍕</span>
        <div class="origin-label">Comida<div class="origin-sub">Escolher qual</div></div>
        <svg class="origin-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </a>
    </div>
  </div>
</div>
</body>
</html>
