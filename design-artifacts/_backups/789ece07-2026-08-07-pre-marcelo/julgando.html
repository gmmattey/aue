<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Julgando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --surface-2:#1f1f18; --accent-strong:#a8d900; --accent-on:#0a0a08; --gold:#f4c430; --gold-strong:#d9ac1c; --danger:#ff3d3f; --danger-strong:#e11a1c; --silver:#c7cad1; --bronze:#c98a4b;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;text-wrap:balance;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }
  @media (prefers-reduced-motion: reduce){ .fill{animation:none !important;transform:scaleX(1) !important;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .screen{flex:1;display:flex;flex-direction:column;padding:24px;}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;width:100%;}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;}
  .h1{font-family:var(--font-display);font-size:clamp(26px,7vw,32px);text-transform:uppercase;letter-spacing:.06em;text-align:center;}

  .metrics{width:100%;max-width:280px;display:flex;flex-direction:column;gap:16px;}
  .metric-row{display:flex;flex-direction:column;gap:7px;}
  .metric-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;}
  .track{height:6px;border-radius:999px;background:var(--border);overflow:hidden;}
  .fill{height:100%;border-radius:999px;background:var(--accent);width:var(--target);transform:scaleX(0);transform-origin:left;animation:fillbar 1.1s cubic-bezier(.2,0,0,1) forwards;}
  @keyframes fillbar{to{transform:scaleX(1);}}
  .m1{--target:92%;animation-delay:.05s;}
  .m2{--target:88%;animation-delay:.2s;}
  .m3{--target:76%;animation-delay:.35s;}
  .m4{--target:84%;animation-delay:.5s;}

  .foot{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:8px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:17px 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent;width:100%;transition:background-color .15s ease,border-color .15s ease;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:var(--accent-strong);}
  .foot-note{font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-julgando">
  <main class="screen">
    <section class="center" data-od-id="judging-hero">
      <div>
        <p class="eyebrow">Analisando o estrago</p>
        <h1 class="h1">Julgando essa porra...</h1>
      </div>

      <div class="metrics" aria-hidden="true" data-od-id="judging-metrics">
        <div class="metric-row"><div class="metric-head"><span>Profundidade</span></div><div class="track"><div class="fill m1"></div></div></div>
        <div class="metric-row"><div class="metric-head"><span>Potência</span></div><div class="track"><div class="fill m2"></div></div></div>
        <div class="metric-row"><div class="metric-head"><span>Duração</span></div><div class="track"><div class="fill m3"></div></div></div>
        <div class="metric-row"><div class="metric-head"><span>Textura</span></div><div class="track"><div class="fill m4"></div></div></div>
      </div>
    </section>

    <div class="foot">
      <a class="btn btn-primary" href="resultado.html" data-od-id="btn-ver-resultado">Ver resultado</a>
      <span class="foot-note">O veredito sai em segundos.</span>
    </div>
  </main>
</div>
</body>
</html>
