<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<script>(function(){try{if(matchMedia("(min-width:768px)").matches && !sessionStorage.getItem("od-desktop-ok")){location.replace("landing.html");}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Auê! · Vez de Você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a08; --surface:#171712; --fg:#f5f3ea; --muted:#93917f; --border:#2b2a22; --accent:#c6ff00;
    --surface-2:#1f1f18; --accent-strong:#a8d900; --accent-on:#0a0a08; --gold:#f4c430; --gold-strong:#d9ac1c; --danger:#ff3d3f; --danger-strong:#e11a1c; --silver:#c7cad1; --bronze:#c98a4b;
    --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
    --page-bg: color-mix(in oklch, var(--bg) 60%, black);
    --font-display:'Anton','Archivo Black',Impact,system-ui,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono: ui-monospace,'JetBrains Mono','SF Mono',Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;background:var(--page-bg);display:flex;justify-content:center;font-family:var(--font-body);color:var(--fg);}
  img,svg{display:block;}
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;}
  a{color:inherit;text-decoration:none;}
  h1{margin:0;}
  p{margin:0;}
  *:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
  @media not (prefers-reduced-motion: reduce){ @view-transition{navigation:auto;} }

  .app-shell{width:100%;max-width:440px;min-height:100dvh;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;position:relative;overflow-x:hidden;animation:page-enter .32s cubic-bezier(.2,0,0,1) both;}
  @keyframes page-enter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .app-shell{animation:none;} }
  @media (min-width:560px){
    body{padding-block:32px;}
    .app-shell{min-height:844px;border-radius:32px;border:1px solid var(--border);box-shadow:0 40px 90px -24px rgba(0,0,0,.65);overflow:hidden;}
  }

  .appbar{display:flex;align-items:center;justify-content:space-between;padding:20px;}
  .h1{font-family:var(--font-display);font-size:18px;text-transform:uppercase;letter-spacing:.06em;}
  .icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--fg);transition:border-color .15s ease;}
  .icon-btn:hover{border-color:var(--fg);}
  .icon-btn svg{width:16px;height:16px;}

  .screen{flex:1;display:flex;flex-direction:column;padding:8px 20px 24px;gap:20px;}

  .turn-banner{text-align:center;padding:8px 0 4px;}
  .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .turn-title{font-family:var(--font-display);font-size:clamp(26px,7vw,32px);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}

  .players{display:flex;flex-direction:column;}
  .player-row{display:flex;align-items:center;gap:14px;padding:13px 10px;border-top:1px solid var(--border);}
  .player-row:first-child{border-top:none;}
  .player-row.current{background:var(--accent-soft);border-radius:14px;border-top:none;margin:2px 0;}
  .status-icon{width:24px;height:24px;flex-shrink:0;display:grid;place-items:center;color:var(--muted);}
  .status-icon svg{width:16px;height:16px;}
  .player-row.done .status-icon{color:var(--accent);}
  .player-row.current .status-icon{color:var(--accent);}
  .avatar{width:38px;height:38px;border-radius:999px;background:var(--border);display:grid;place-items:center;font-family:var(--font-display);font-size:14px;flex-shrink:0;}
  .player-info{flex:1;min-width:0;}
  .player-name{font-weight:600;font-size:14px;}
  .player-sub{font-size:12px;color:var(--muted);}
  .player-score{font-family:var(--font-mono);font-weight:700;font-size:15px;}

  .ad-slot{padding:16px;border:1px dashed var(--border);border-radius:var(--radius-lg,24px);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:80px;text-align:center;}
  .ad-slot-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
  .ad-slot-note{font-size:11.5px;color:var(--muted);}

  .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:8px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:17px 24px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;border:1px solid transparent;width:100%;transition:background-color .15s ease,border-color .15s ease;}
  .btn-primary{background:var(--accent);color:var(--bg);}
  .btn-primary:hover{background:var(--accent-strong);}
  .foot-link{font-size:13px;color:var(--muted);font-weight:600;}
  .foot-link:hover{color:var(--fg);}
</style>
</head>
<body>
<div class="app-shell" data-od-id="screen-grupo-vez">
  <header class="appbar" data-od-id="appbar">
    <a class="icon-btn" href="home.html" aria-label="Sair da rodada" data-od-id="close-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
    <span class="h1">Arrotar em grupo</span>
    <span style="width:44px"></span>
  </header>

  <main class="screen">
    <div class="turn-banner" data-od-id="turn-banner">
      <p class="eyebrow">É a sua vez</p>
      <h1 class="turn-title">Vez de Você</h1>
    </div>

    <div class="players" data-od-id="grupo-players">
      <div class="player-row current" data-od-id="grupo-player-voce">
        <span class="status-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        <div class="avatar">V</div>
        <div class="player-info"><div class="player-name">Você</div><div class="player-sub">Sua vez — passa o aparelho depois</div></div>
      </div>
      <div class="player-row" data-od-id="grupo-player-2">
        <span class="status-icon"></span>
        <div class="avatar">2</div>
        <div class="player-info"><div class="player-name">Jogador 2</div><div class="player-sub">Aguardando</div></div>
      </div>
      <div class="player-row" data-od-id="grupo-player-3">
        <span class="status-icon"></span>
        <div class="avatar">3</div>
        <div class="player-info"><div class="player-name">Jogador 3</div><div class="player-sub">Aguardando</div></div>
      </div>
    </div>

    <div class="ad-slot" data-od-id="ad-slot-grupo-vez" role="complementary" aria-label="Anúncio">
      <span class="ad-slot-label">Anúncio</span>
      <span class="ad-slot-note">Espaço reservado — intersticial entre turnos</span>
    </div>

    <div class="foot">
      <a class="btn btn-primary" href="permissao.html" data-od-id="btn-arrotar">Arrotar</a>
      <a class="foot-link" href="grupo-resultado.html" data-od-id="link-ver-vencedor">Todo mundo já jogou? Ver vencedor →</a>
    </div>
  </main>
</div>
</body>
</html>
