      <h1>How to play Auê</h1>
      <p>
        Auê is an online burp competition. You burp on your phone, the game gives
        it a score from 0 to 100, and that number becomes the target your friend
        has to beat. The score is not a diagnosis. It is the scoreboard.
      </p>

      <h2>1. Burp</h2>
      <p>
        Tap the burp button and let one out. The microphone is requested when the
        round starts. If the game validates the sound as a burp, it goes to judging.
      </p>

      <h2>2. Set the score</h2>
      <p>
        Auê uses the sound to produce a score from 0 to 100. For the player, the
        rule is simple: that number is the target. Scored 94? Your friend needs 95.
      </p>

      <h2>3. Challenge a friend</h2>
      <p>
        Send the 1v1 link. Your friend opens it on their own phone, hears your
        burp, records an answer and puts their score against yours. No room code,
        no account wall and no need to play at the same time.
      </p>

      <h2>4. Scoreboard and rematch</h2>
      <p>
        The higher score takes the round. Lost? Ask for a rematch. Won? Asking for
        another one is also perfectly reasonable.
      </p>

      <h2>A free burp game in your browser</h2>
      <p>
        Auê runs in a mobile browser on Android or iPhone. If you found us while
        looking for a burp game, burp challenge or burping contest with friends,
        that is basically the idea — except Auê gives the argument a scoreboard.
      </p>

      <p><a href="/">Start a burp competition</a> · <a href="/como-jogar">Português</a></p>
