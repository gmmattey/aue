    <noscript>
      <h1>Auê! — online burp competition</h1>
      <p>
        Auê turns a burp into a competition. You burp, get a score from 0 to 100
        and use that number as the target for a friend to beat. Highest score
        takes the round.
      </p>
      <p>
        Send the 1v1 link to a friend. They hear your burp, record an answer on
        their own phone and put their score against yours. No account wall, no
        room code and no need to play at the same time.
      </p>
      <p>
        Lost? Rematch. Won? Rematch anyway. Auê is a free burp game that runs
        directly in the browser. If you were looking for a burp challenge or a
        burping contest with friends, this is the stupid argument you came for.
      </p>
      <p><a href="/en/how-to-play">How to play Auê</a> · <a href="/">Português</a></p>
